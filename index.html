<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Empire Tycoon</title>
<style>
:root{--bg1:#1a1a1f;--bg2:#2a2a33;--accent:#9aa0a6;--text:#f1f1f1;--card1:#3a3a42;--card2:#6b6b75}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;transition:background 1.5s}
header{padding:14px;text-align:center;border-bottom:1px solid #ffffff22;background:inherit;z-index:50}
body.on-card header{position:sticky;top:0}
#money{font-size:32px;font-weight:700;color:var(--accent);transition:color 1s}
#info{font-size:13px;opacity:.7;margin-top:4px}
nav{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #ffffff22}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-width:25%;padding:12px;background:none;border:none;color:var(--text);font-size:14px;opacity:.6;cursor:pointer;position:relative;white-space:nowrap}
nav button.active{opacity:1;border-bottom:2px solid var(--accent)}
.badge{display:none;position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:#e33;color:#fff;font-size:11px;font-weight:700;line-height:18px;padding:0 5px}
.page{display:none;padding:14px;animation:fade .3s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#cardWrap{display:flex;justify-content:center;margin:24px 0}
#card{width:290px;height:180px;border-radius:16px;position:relative;cursor:pointer;background:linear-gradient(135deg,var(--card1),var(--card2));box-shadow:0 10px 30px #0008,inset 0 0 0 1px #ffffff22;transition:transform .08s,background .6s;overflow:hidden}
#card:active{transform:scale(.97)}
#card::before{content:"";position:absolute;left:20px;top:50px;width:44px;height:32px;border-radius:6px;background:linear-gradient(135deg,#e6c36a,#a8842f);z-index:2}
#card .num{position:absolute;bottom:18px;left:20px;font-size:14px;letter-spacing:3px;opacity:.7;z-index:2}
#card .pattern{position:absolute;inset:0;pointer-events:none;z-index:1}
.float{position:fixed;pointer-events:none;font-weight:700;color:#fff;animation:up .9s forwards;z-index:99}
.float.lucky{color:#ffd54a;font-size:20px}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.item{background:#ffffff0d;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .t{font-weight:600}
.item .d{font-size:12px;opacity:.65}
.item.ach.done{opacity:.55}
.item.ach.ready{box-shadow:0 0 0 1px #ffd54a}
button{background:var(--accent);border:none;padding:8px 12px;border-radius:8px;color:#111;font-weight:600;cursor:pointer;white-space:nowrap}
button:disabled{opacity:.4;cursor:default}
#claimAll{display:none;width:100%;margin-bottom:12px;padding:10px;background:#ffd54a}
label{display:block;margin:10px 0 4px;font-size:13px;opacity:.8}
select,input[type=range]{width:100%;padding:8px;border-radius:8px;border:none;background:#ffffff14;color:var(--text)}
select option{background:#2a2a33;color:var(--text)}
#resetBtn{background:#e33;color:#fff;width:100%;margin-top:16px}
.comp-card{background:#ffffff0d;border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.comp-card .t{font-weight:600}
.comp-card .d{font-size:12px;opacity:.65}
.sec{font-size:13px;opacity:.7;margin:12px 0 6px}
.back{background:none;color:var(--text);border:1px solid #ffffff33;margin-bottom:12px}
.bar{height:6px;border-radius:3px;background:#ffffff1a;overflow:hidden;margin-top:4px}
.bar>div{height:100%;background:var(--accent)}
.sortBtn{background:#ffffff14;color:var(--text);font-size:12px;padding:6px 10px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.blockCard{background:#ffffff0d;border-radius:14px;padding:18px;margin-bottom:12px;cursor:pointer;font-size:18px;font-weight:700}
.blockCard small{display:block;font-size:12px;opacity:.6;font-weight:400;margin-top:4px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff14;font-size:14px}
</style>
</head>
<body>
<header>
  <div id="money">$0</div>
  <div id="info"></div>
  <div id="gems" style="font-size:13px;margin-top:6px">💎 0</div>
</header>
<nav>
  <button data-p="comp" id="nComp">Companies</button>
  <button data-p="game" class="active" id="nGame">Card</button>
  <button data-p="goods" id="nGoods">Assets</button>
  <button data-p="ach" id="nAchT"><span id="hAch">Achievements</span><span class="badge" id="badge">0</span></button>
  <button data-p="profile" id="nProf">Profile</button>
  <button data-p="set" id="nSet">Settings</button>
</nav>

<div class="page active" id="game">
  <div id="cardWrap"><div id="card"><div class="pattern" id="pattern"></div><div class="num">•••• •••• •••• 0000</div></div></div>
  <div class="sec" id="hUp">Upgrades</div>
  <div id="upsList"></div>
</div>

<div class="page" id="comp">
  <div id="compList"></div>
</div>

<div class="page" id="goods">
  <div id="goodsRoot"></div>
</div>

<div class="page" id="ach">
  <button id="claimAll"></button>
  <div id="achList"></div>
</div>

<div class="page" id="profile">
  <div id="profList"></div>
</div>

<div class="page" id="set">
  <label id="lLang">Language</label>
  <select id="langSel"><option value="en">English</option><option value="fr">Français</option></select>
  <label id="lSnd">Sound effects</label>
  <select id="sndSel"><option value="1">On</option><option value="0">Off</option></select>
  <label id="lMus">Music</label>
  <select id="musSel"><option value="1">On</option><option value="0">Off</option></select>
  <label id="lVol">Music volume</label>
  <input type="range" id="volRange" min="0" max="100">
  <label id="lSkin">Card skin</label>
  <select id="skinSel"></select>
  <button id="resetBtn"></button>
</div>
<script>
// ============ STATE ============
const DEF={money:0,total:0,clicks:0,gems:0,lang:"en",snd:1,mus:1,vol:30,
  ups:{click:0,mult:0,tap:0,lucky:0},ach:{},claimed:{},skinChoice:0,
  companies:{},compLevels:{},
  re:{},            // real estate : id -> nb possédés
  reLv:{},          // real estate upgrades : id -> {k:lvl}
  veh:{},           // véhicules : id -> nb possédés
  stats:{byCard:0,byComp:0,byRe:0,byVeh:0,bought:0,compBought:0,reBought:0,vehBought:0},
  reSort:"asc"
};
let S=JSON.parse(localStorage.getItem("empireTycoon")||"null")||JSON.parse(JSON.stringify(DEF));
for(const k in DEF){if(S[k]===undefined)S[k]=JSON.parse(JSON.stringify(DEF[k]))}
for(const k in DEF.ups){if(S.ups[k]===undefined)S.ups[k]=0}
for(const k in DEF.stats){if(S.stats[k]===undefined)S.stats[k]=0}
function save(){localStorage.setItem("empireTycoon",JSON.stringify(S))}

// ============ TEXTES ============
const TX={
en:{card:"Card",comp:"Companies",goods:"Assets",ach:"Achievements",prof:"Profile",set:"Settings",up:"Upgrades",lang:"Language",snd:"Sound effects",mus:"Music",vol:"Music volume",skin:"Card skin",res:"Reset progress",
confirm:"WARNING: This will PERMANENTLY erase ALL your progress (money, upgrades, achievements, skins, gems, companies, assets, profile and settings).\n\nClick OK to reset EVERYTHING. This cannot be undone.\n\nClick Cancel to keep your progress.",
perclick:"per click",persec:"per sec",claim:"Claim",claimall:"Claim all",on:"On",off:"Off",max:"MAX",lvl:"Lvl",buy:"Buy",merge:"Merge",owned:"Owned",back:"← Back",price:"Price",income:"Income",upgrades:"Upgrades",
realestate:"Real estate",vehicles:"Vehicles",cars:"Cars",aircraft:"Aircraft",boats:"Boats",sortAsc:"Price ↑",sortDesc:"Price ↓",rent:"Rent",
u_click:"Better Chip",u_clickd:"+$1 per click (max 50)",u_mult:"Gold Swipe",u_multd:"x1.1 click gain (max 10)",u_tap:"Contactless",u_tapd:"+$5 per click (max 30)",u_lucky:"Lucky Tap",u_luckyd:"+2% chance of a x5 click (max 25)",
pTotal:"Total earned",pCard:"Card",pComp:"Companies",pRe:"Real estate",pVeh:"Vehicles",pOther:"Other",pShare:"of total",pBought:"Items bought",pCompB:"Companies bought",pReB:"Properties bought",pVehB:"Vehicles bought",pClicks:"Card clicks",pAch:"Achievements unlocked"},
fr:{card:"Carte",comp:"Entreprises",goods:"Biens",ach:"Succès",prof:"Profil",set:"Paramètres",up:"Améliorations",lang:"Langue",snd:"Effets sonores",mus:"Musique",vol:"Volume musique",skin:"Skin de carte",res:"Réinitialiser la progression",
confirm:"ATTENTION : Cela va effacer DÉFINITIVEMENT toute ta progression (argent, améliorations, succès, skins, gemmes, entreprises, biens, profil et paramètres).\n\nClique sur OK pour TOUT réinitialiser. Cette action est irréversible.\n\nClique sur Annuler pour garder ta progression.",
perclick:"par clic",persec:"par sec",claim:"Réclamer",claimall:"Tout réclamer",on:"Activé",off:"Désactivé",max:"MAX",lvl:"Niv",buy:"Acheter",merge:"Fusionner",owned:"Possédées",back:"← Retour",price:"Prix",income:"Revenu",upgrades:"Améliorations",
realestate:"Immobilier",vehicles:"Véhicules",cars:"Voitures",aircraft:"Aéronefs",boats:"Bateaux",sortAsc:"Prix ↑",sortDesc:"Prix ↓",rent:"Loyer",
u_click:"Meilleure puce",u_clickd:"+1$ par clic (max 50)",u_mult:"Glissade dorée",u_multd:"x1,1 gain par clic (max 10)",u_tap:"Sans contact",u_tapd:"+5$ par clic (max 30)",u_lucky:"Clic chanceux",u_luckyd:"+2% de chance d'un clic x5 (max 25)",
pTotal:"Total gagné",pCard:"Carte",pComp:"Entreprises",pRe:"Immobilier",pVeh:"Véhicules",pOther:"Autre",pShare:"du total",pBought:"Achats",pCompB:"Entreprises achetées",pReB:"Biens immobiliers achetés",pVehB:"Véhicules achetés",pClicks:"Clics sur la carte",pAch:"Succès débloqués"}
};
function t(k){return (TX[S.lang]&&TX[S.lang][k])||TX.en[k]||k}
function nm(o){return S.lang==="fr"?(o.fr||o.en):o.en}

// ============ SKINS (motifs CSS) ============
const SKINS=[
  {n:"Basic",at:0,g1:"#3a3a42",g2:"#6b6b75",bg1:"#1a1a1f",bg2:"#2a2a33",acc:"#9aa0a6",pat:"none"},
  {n:"Silver",at:25000,g1:"#d7dbe0",g2:"#7d848e",bg1:"#1c2129",bg2:"#2d3440",acc:"#cfd6df",pat:"repeating-linear-gradient(45deg,#ffffff18 0 6px,transparent 6px 14px)"},
  {n:"Gold",at:100000,g1:"#f5d77a",g2:"#a7791c",bg1:"#2a2110",bg2:"#43341a",acc:"#f5d77a",pat:"radial-gradient(circle at 80% 20%,#fff8d088,transparent 45%),repeating-radial-gradient(circle at 0 0,#ffffff12 0 2px,transparent 2px 10px)"},
  {n:"Checker",at:1000000,g1:"#2b2b33",g2:"#55555f",bg1:"#15151a",bg2:"#22222b",acc:"#c0c4cc",pat:"conic-gradient(#ffffff14 25%,transparent 0 50%,#ffffff14 0 75%,transparent 0) 0 0/28px 28px"},
  {n:"Emerald",at:100000000,g1:"#46d69a",g2:"#106b4a",bg1:"#0c1f18",bg2:"#16352a",acc:"#6fe3b2",pat:"radial-gradient(circle at 15% 85%,#b8ffe055,transparent 40%),repeating-linear-gradient(-30deg,#ffffff10 0 4px,transparent 4px 18px)"},
  {n:"Sapphire",at:1000000000,g1:"#4f8cff",g2:"#1a3f9a",bg1:"#0b1530",bg2:"#162650",acc:"#7fb0ff",pat:"linear-gradient(120deg,transparent 30%,#ffffff33 45%,transparent 60%),repeating-linear-gradient(0deg,#ffffff0d 0 2px,transparent 2px 12px)"},
  {n:"Carbon",at:10000000000,g1:"#1d1d1d",g2:"#4a4a4a",bg1:"#0a0a0a",bg2:"#1a1a1a",acc:"#bdbdbd",pat:"repeating-linear-gradient(45deg,#ffffff0c 0 3px,transparent 3px 6px),repeating-linear-gradient(-45deg,#ffffff0c 0 3px,transparent 3px 6px)"},
  {n:"Aurora",at:100000000000,g1:"#7a3cff",g2:"#1fd1b8",bg1:"#120a24",bg2:"#1b1040",acc:"#b38bff",pat:"radial-gradient(ellipse at 30% 0%,#7dffe866,transparent 60%),radial-gradient(ellipse at 80% 100%,#ff7ad966,transparent 55%)"},
  {n:"DIAMOND",at:1000000000000,g1:"#e6f7ff",g2:"#7fb9d9",bg1:"#101a24",bg2:"#1d2e3d",acc:"#bfe9ff",pat:"conic-gradient(from 45deg,#ffffff55,transparent 20%,#ffffff33 40%,transparent 60%,#ffffff55 80%,transparent)"},
  {n:"Empire",at:10000000000000,g1:"#5a1a7a",g2:"#ff6ad5",bg1:"#1a0626",bg2:"#33104a",acc:"#ff9be8",pat:"radial-gradient(circle at 50% 120%,#ffd1f055,transparent 60%),repeating-linear-gradient(60deg,#ffffff12 0 2px,transparent 2px 16px)"}
];
</script>
<script>
// ============ ENTREPRISES : DONNÉES ============
// merge:{to:"id", need:N} => fusion possible seulement si défini
const COMPANIES=[
  {id:"shop",icon:"🏪",en:"Corner Shop",fr:"Supérette",base:75000,g:1.15,rev:150,
    merge:{to:"super",need:4},
    ups:[{k:"stock",en:"Stock shelves",fr:"Rayonnages",cost:40000,inc:300,max:5},
         {k:"cam",en:"Security cameras",fr:"Caméras",cost:60000,inc:450,max:3},
         {k:"ext",en:"Extended hours",fr:"Horaires étendus",cost:90000,inc:600,max:3}]},
  {id:"super",icon:"🛒",en:"Supermarket",fr:"Supermarché",base:900000,g:1.2,rev:1400,
    ups:[{k:"cash",en:"Extra checkouts",fr:"Caisses supplémentaires",cost:300000,inc:2000,max:6},
         {k:"brand",en:"Own brand line",fr:"Marque propre",cost:500000,inc:3000,max:4}]},
  {id:"taxi",icon:"🚕",en:"Taxi Company",fr:"Compagnie de taxi",base:2500000,g:1.2,rev:3000,
    ups:[{k:"veh",en:"Buy vehicles",fr:"Acheter des véhicules",cost:250000,inc:1800,max:10},
         {k:"drv",en:"Hire drivers",fr:"Embaucher des chauffeurs",cost:120000,inc:1200,max:10},
         {k:"zone",en:"Acquire city zones",fr:"Acquérir des secteurs",cost:600000,inc:4000,max:6}]},
  {id:"carwash",icon:"🧽",en:"Car Wash",fr:"Station de lavage",base:6000000,g:1.22,rev:9000,
    ups:[{k:"bay",en:"Add wash bays",fr:"Ajouter des bornes",cost:2000000,inc:12000,max:4},
         {k:"wax",en:"Premium wax service",fr:"Service cire premium",cost:3000000,inc:18000,max:3}]},
  {id:"rental",icon:"🚗",en:"Car Rental",fr:"Loueur de voitures",base:20000000,g:1.22,rev:30000,
    ups:[{k:"fleet",en:"Expand fleet",fr:"Agrandir la flotte",cost:8000000,inc:45000,max:8},
         {k:"branch",en:"Open branches",fr:"Ouvrir des agences",cost:15000000,inc:70000,max:5}]},
  {id:"hotel",icon:"🏨",en:"Hotel",fr:"Hôtel",base:50000000,g:1.24,rev:60000,
    ups:[{k:"rooms",en:"Add rooms",fr:"Ajouter des chambres",cost:20000000,inc:90000,max:5},
         {k:"spa",en:"Spa & restaurant",fr:"Spa & restaurant",cost:35000000,inc:120000,max:3}]},
  {id:"museum",icon:"🏛️",en:"Museum",fr:"Musée",base:120000000,g:1.25,rev:100000,
    ups:[{k:"exh",en:"New exhibitions",fr:"Nouvelles expositions",cost:50000000,inc:150000,max:5},
         {k:"gift",en:"Gift shop",fr:"Boutique souvenirs",cost:30000000,inc:90000,max:3}],
    vehSlots:true},
  {id:"bank",icon:"🏦",en:"Bank",fr:"Banque",base:250000000,g:1.25,rev:250000,
    merge:{to:"holding",need:3},
    ups:[{k:"branch",en:"Open branches",fr:"Ouvrir des agences",cost:90000000,inc:350000,max:6},
         {k:"loan",en:"Loan department",fr:"Service prêts",cost:150000000,inc:500000,max:4}]},
  {id:"holding",icon:"🏢",en:"Shareholding Group",fr:"Groupe de participations",base:3000000000,g:1.28,rev:2800000,
    ups:[{k:"stake",en:"Buy stakes",fr:"Prendre des participations",cost:800000000,inc:3000000,max:5},
         {k:"board",en:"Board seats",fr:"Sièges au conseil",cost:1200000000,inc:4000000,max:4}]},
  {id:"club",icon:"⚽",en:"Football Club",fr:"Club de football",base:1500000000,g:1.3,rev:1200000,
    ups:[{k:"stad",en:"Stadium upgrade",fr:"Rénover le stade",cost:600000000,inc:2000000,max:4},
         {k:"player",en:"Sign players",fr:"Recruter des joueurs",cost:800000000,inc:3000000,max:8}]},
  {id:"oil",icon:"🛢️",en:"Oil Station",fr:"Station pétrolière",base:8000000000,g:1.3,rev:6000000,
    ups:[{k:"rig",en:"Drill rigs",fr:"Forages",cost:3000000000,inc:9000000,max:6},
         {k:"refine",en:"Refineries",fr:"Raffineries",cost:5000000000,inc:14000000,max:4}]},
  {id:"space",icon:"🚀",en:"Space Company",fr:"Entreprise spatiale",base:60000000000,g:1.35,rev:40000000,
    ups:[{k:"sat",en:"Launch satellites",fr:"Lancer des satellites",cost:20000000000,inc:60000000,max:6},
         {k:"base",en:"Build orbital base",fr:"Base orbitale",cost:40000000000,inc:90000000,max:3}]}
];
const COMP_BY_ID={};COMPANIES.forEach(c=>COMP_BY_ID[c.id]=c);
let openComp=null;

function compCount(id){return S.companies[id]||0}
function compLvl(id,k){return (S.compLevels[id]&&S.compLevels[id][k])||0}
function buyPrice(c){return Math.floor(c.base*Math.pow(c.g,compCount(c.id)))}
function vehRevOf(){return 0} // placeholder : revenu des véhicules du musée (à définir)
function compRev(c){
  let r=compCount(c.id)*c.rev;
  c.ups.forEach(u=>{r+=compLvl(c.id,u.k)*u.inc});
  return r;
}
function companyRev(){return COMPANIES.reduce((s,c)=>s+compRev(c),0)}
function addStat(key,n){S.stats[key]=(S.stats[key]||0)+n}
function buyCompany(c){
  const p=buyPrice(c);
  if(S.money<p)return;
  S.money-=p;
  S.companies[c.id]=compCount(c.id)+1;
  S.stats.compBought++;S.stats.bought++;
  click();save();update();checkAch();renderCompanies();
}
function buyCompUp(c,u){
  const lv=compLvl(c.id,u.k);
  if(lv>=u.max||compCount(c.id)<1)return;
  const cost=Math.floor(u.cost*Math.pow(1.5,lv));
  if(S.money<cost)return;
  S.money-=cost;
  if(!S.compLevels[c.id])S.compLevels[c.id]={};
  S.compLevels[c.id][u.k]=lv+1;
  click();save();update();checkAch();renderCompanies();
}
function mergeCompany(c){
  if(!c.merge)return;
  const to=COMP_BY_ID[c.merge.to];
  if(!to||compCount(c.id)<c.merge.need)return;
  S.companies[c.id]-=c.merge.need;
  S.companies[to.id]=compCount(to.id)+1;
  click();save();update();checkAch();
  openComp=COMPANIES.indexOf(to);renderCompanies();
}
function renderCompanies(){
  const list=document.getElementById("compList");
  if(openComp===null){
    list.innerHTML=COMPANIES.map((c,i)=>
      '<div class="comp-card" data-open="'+i+'"><div class="t">'+c.icon+' '+nm(c)+'</div><div class="d">'+t("owned")+': '+compCount(c.id)+' • '+t("income")+': '+fmt(compRev(c))+' '+t("persec")+'</div></div>'
    ).join("");
    list.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{openComp=+el.dataset.open;renderCompanies()});
    return;
  }
  const c=COMPANIES[openComp],price=buyPrice(c),n=compCount(c.id);
  let h='<button class="back" data-back="1">'+t("back")+'</button>';
  h+='<div class="item"><div><div class="t">'+c.icon+' '+nm(c)+'</div><div class="d">'+t("owned")+': '+n+' • '+t("income")+': '+fmt(compRev(c))+' '+t("persec")+'</div></div></div>';
  h+='<div class="item"><div><div class="t">'+t("buy")+'</div><div class="d">'+t("price")+': '+fmt(price)+'</div></div><button data-buy="1" '+(S.money<price?"disabled":"")+'>'+t("buy")+'</button></div>';
  if(c.merge){
    const to=COMP_BY_ID[c.merge.to],ok=n>=c.merge.need;
    h+='<div class="item"><div><div class="t">'+t("merge")+' → '+to.icon+' '+nm(to)+'</div><div class="d">'+c.merge.need+' × '+nm(c)+'</div></div><button data-merge="1" '+(ok?"":"disabled")+'>'+t("merge")+'</button></div>';
  }
  h+='<div class="sec">'+t("upgrades")+'</div>';
  c.ups.forEach(u=>{
    const lv=compLvl(c.id,u.k),mx=lv>=u.max;
    const cost=Math.floor(u.cost*Math.pow(1.5,lv));
    h+='<div class="item"><div><div class="t">'+nm(u)+' <small>('+t("lvl")+' '+lv+'/'+u.max+')</small></div><div class="d">+'+fmt(u.inc)+' '+t("persec")+'</div></div><button data-cu="'+u.k+'" '+(mx||n<1||S.money<cost?"disabled":"")+'>'+(mx?t("max"):fmt(cost))+'</button></div>';
  });
  list.innerHTML=h;
  list.querySelector("[data-back]").onclick=()=>{openComp=null;renderCompanies()};
  list.querySelector("[data-buy]").onclick=()=>buyCompany(c);
  const mb=list.querySelector("[data-merge]");
  if(mb)mb.onclick=()=>mergeCompany(c);
  list.querySelectorAll("[data-cu]").forEach(b=>b.onclick=()=>{
    buyCompUp(c,c.ups.find(x=>x.k===b.dataset.cu));
  });
}
      </script>
<script>
// ============ IMMOBILIER ============
const RE=[

function reUpCost(re,u){return Math.floor(re.price*u.base*Math.pow(1.6,reLevel(re.id,u.k)))}
function reRentOne(re){
  let m=1;
  RE_UPS.forEach(u=>{m+=u.mult*reLevel(re.id,u.k)});
  return re.rent*m;
}
function reIncome(){
  return RE.reduce((s,re)=>s+reOwned(re.id)*reRentOne(re),0);
}
function buyRE(re){
  if(S.money<re.price)return;
  S.money-=re.price;
  S.re[re.id]=reOwned(re.id)+1;
  S.stats.reBought++;S.stats.bought++;
  click();save();update();checkAch();renderGoods();
}
function buyREUp(re,u){
  const lv=reLevel(re.id,u.k);
  if(lv>=RE_UP_MAX||reOwned(re.id)<1)return;
  const cost=reUpCost(re,u);
  if(S.money<cost)return;
  S.money-=cost;
  if(!S.reLv[re.id])S.reLv[re.id]={};
  S.reLv[re.id][u.k]=lv+1;
  click();save();update();checkAch();renderGoods();
}

// ============ SON ============
let AC=null;
function getAC(){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended"&&!document.hidden)AC.resume();
  return AC;
}
function click(){
  if(!S.snd)return;
  try{
    const a=getAC();
    const o=a.createOscillator(),g=a.createGain();
    o.frequency.value=520+Math.random()*60;o.type="triangle";
    g.gain.setValueAtTime(.06,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.08);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.08);
  }catch(e){}
}
const CHORDS=[[261.63,329.63,392.00],[349.23,440.00,523.25],[293.66,369.99,440.00],[392.00,493.88,587.33]];
const MELODY=[523.25,587.33,659.25,783.99,659.25,587.33,523.25,659.25,783.99,880.00,783.99,659.25];
let chordIdx=0,melIdx=0,musicStarted=false,musicGain=null,musicTimer=null;
function musicVol(){return S.mus&&S.snd!==0?(S.vol/100)*0.12:0}
function playNote(freq,start,dur,type,peak){
  const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(peak,start+Math.min(0.4,dur*0.3));
  g.gain.linearRampToValueAtTime(0,start+dur);
  o.connect(g);g.connect(musicGain);
  o.start(start);o.stop(start+dur+0.05);
}
function playChord(){
  if(!S.mus||!AC||document.hidden||!musicGain)return;
  try{
    const now=AC.currentTime,ch=CHORDS[chordIdx%CHORDS.length];chordIdx++;
    ch.forEach(f=>playNote(f,now,3.8,"triangle",0.18));
    for(let i=0;i<2;i++){
      const f=MELODY[melIdx%MELODY.length];melIdx++;
      playNote(f,now+0.3+i*1.8,1.2,"sine",0.14);
    }
  }catch(e){}
}
function startMusic(){
  if(musicStarted)return;
  try{
    const a=getAC();
    musicGain=a.createGain();
    musicGain.gain.value=musicVol();
    musicGain.connect(a.destination);
    musicStarted=true;
    playChord();
    musicTimer=setInterval(playChord,4000);
  }catch(e){}
}
function updateMusicVol(){
  if(musicGain&&AC)musicGain.gain.setTargetAtTime(musicVol(),AC.currentTime,0.1);
}
["pointerdown","touchstart","keydown"].forEach(ev=>
  document.addEventListener(ev,()=>{if(S.mus)startMusic();else getAC()},{passive:true}));
document.addEventListener("visibilitychange",()=>{
  if(!AC)return;
  if(document.hidden){
    if(musicGain){musicGain.gain.cancelScheduledValues(AC.currentTime);musicGain.gain.setValueAtTime(0,AC.currentTime)}
    AC.suspend();
  }else{
    if(AC.state==="suspended")AC.resume();
    if(musicGain){
      const target=musicVol();
      musicGain.gain.cancelScheduledValues(AC.currentTime);
      musicGain.gain.setValueAtTime(0,AC.currentTime);
      musicGain.gain.linearRampToValueAtTime(target,AC.currentTime+1.5);
    }
  }
});

  }).join("");
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{

  document.getElementById("upsList").innerHTML=Object.keys(UPS).map(k=>{
    const mx=isMax(k);
    return '<div class="item"><div><div class="t">'+t(UPS[k].key)+' <small>('+t("lvl")+' '+S.ups[k]+')</small></div><div class="d">'+t(UPS[k].key+"d")+'</div></div><button data-u="'+k+'" '+(mx||S.money<cost(k)?"disabled":"")+'>'+(mx?t("max"):fmt(cost(k)))+'</button></div>';
  }).join("");
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.u,c=cost(k);
    if(!isMax(k)&&S.money>=c){S.money-=c;S.ups[k]++;click();update();checkAch();save()}
  });
}
function update(){
  document.getElementById("money").textContent=fmt(S.money);
  document.getElementById("info").textContent=fmt(perClick())+" "+t("perclick")+" • "+fmt(perSecond())+" "+t("persec");
  document.getElementById("gems").textContent="💎 "+S.gems;
  applySkin();renderUps();
}
function applyLang(){
  document.getElementById("nGame").textContent=t("card");
  document.getElementById("nComp").textContent=t("comp");
  document.getElementById("nGoods").textContent=t("goods");
  document.getElementById("hAch").textContent=t("ach");
  document.getElementById("nProf").textContent=t("prof");
  document.getElementById("nSet").textContent=t("set");
  document.getElementById("hUp").textContent=t("up");
  document.getElementById("lLang").textContent=t("lang");
  document.getElementById("lSnd").textContent=t("snd");
  document.getElementById("lMus").textContent=t("mus");
  document.getElementById("lVol").textContent=t("vol");
  document.getElementById("lSkin").textContent=t("skin");
  document.getElementById("resetBtn").textContent=t("res");
  const so=document.getElementById("sndSel").options,mo=document.getElementById("musSel").options;
  so[0].text=mo[0].text=t("on");so[1].text=mo[1].text=t("off");
  document.getElementById("langSel").value=S.lang;
  document.getElementById("sndSel").value=S.snd;
  document.getElementById("musSel").value=S.mus;
  document.getElementById("volRange").value=S.vol;
  renderSkinSel();renderAch();update();renderCompanies();renderGoods();renderProfile();
}
function updateStickyHeader(page){document.body.classList.toggle("on-card",page==="game")}
      </script>
<script>
// ============ RESET ============
let saveTimer=null;
function resetGame(){
  if(!window.confirm(t("confirm")))return;
  clearInterval(saveTimer);
  Object.keys(localStorage).filter(k=>k.startsWith("empireTycoon")).forEach(k=>localStorage.removeItem(k));
  location.reload();
}

// ============ EVENTS ============
document.getElementById("card").addEventListener("pointerdown",e=>{
  let g=perClick(),lucky=false;
  if(Math.random()<luckyChance()){g*=5;lucky=true}
  S.clicks++;click();
  addIncome("byCard",g);
  const f=document.createElement("div");
  f.className="float"+(lucky?" lucky":"");
  f.textContent="+"+fmt(g)+(lucky?" ★":"");
  f.style.left=(e.clientX-20)+"px";
  f.style.top=(e.clientY-30)+"px";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),900);
  update();checkAch();
});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.getElementById(b.dataset.p).classList.add("active");
  if(b.dataset.p==="comp"){openComp=null;renderCompanies()}
  if(b.dataset.p==="goods"){goodsView="root";renderGoods()}
  if(b.dataset.p==="profile")renderProfile();
  updateStickyHeader(b.dataset.p);
});
document.getElementById("claimAll").onclick=()=>{
  ACH.forEach(a=>claim(a.id));
  renderAch();renderSkinSel();applySkin();update();
};
document.getElementById("langSel").onchange=e=>{S.lang=e.target.value;applyLang();save()};
document.getElementById("sndSel").onchange=e=>{S.snd=+e.target.value;updateMusicVol();save()};
document.getElementById("musSel").onchange=e=>{
  S.mus=+e.target.value;
  if(S.mus)startMusic();
  updateMusicVol();save();
};
document.getElementById("volRange").oninput=e=>{S.vol=+e.target.value;updateMusicVol();save()};
document.getElementById("skinSel").onchange=e=>{S.skinChoice=+e.target.value;applySkin();save()};
document.getElementById("resetBtn").addEventListener("click",resetGame);

// ============ LOOP ============
setInterval(()=>{
  const cr=compRevenueTick(),rr=reIncome(),ps=perSecond();
  if(cr>0)addIncome("byComp",cr);
  if(rr>0)addIncome("byRe",rr);
  if(document.getElementById("comp").classList.contains("active"))renderCompanies();
  if(document.getElementById("goods").classList.contains("active"))renderGoods();
  if(document.getElementById("profile").classList.contains("active"))renderProfile();
  update();
  checkAch();
},1000);
saveTimer=setInterval(save,10000);
window.addEventListener("beforeunload",save);

// ============ INIT ============
applyLang();
checkAch();
updateStickyHeader("game");
</script>
</body>
</html>
