<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Empire Tycoon</title>
<style>
:root{--bg1:#1a1a1f;--bg2:#2a2a33;--accent:#9aa0a6;--text:#f1f1f1;--card1:#3a3a42;--card2:#6b6b75}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;transition:background 1.5s}
header{padding:14px;text-align:center;border-bottom:1px solid #ffffff22;background:inherit;z-index:50}
body.on-card header{position:sticky;top:0}
#money{font-size:32px;font-weight:700;color:var(--accent);transition:color 1s}
#info{font-size:13px;opacity:.7;margin-top:4px}
nav{display:flex;border-bottom:1px solid #ffffff22}
nav button{flex:1;padding:12px;background:none;border:none;color:var(--text);font-size:14px;opacity:.6;cursor:pointer;position:relative}
nav button.active{opacity:1;border-bottom:2px solid var(--accent)}
.badge{display:none;position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:#e33;color:#fff;font-size:11px;font-weight:700;line-height:18px;padding:0 5px}
.page{display:none;padding:14px;animation:fade .3s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#cardWrap{display:flex;justify-content:center;margin:24px 0}
#card{width:290px;height:180px;border-radius:16px;position:relative;cursor:pointer;background:linear-gradient(135deg,var(--card1),var(--card2));box-shadow:0 10px 30px #0008,inset 0 0 0 1px #ffffff22;transition:transform .08s,background .6s}
#card:active{transform:scale(.95)}
#card .chip{position:absolute;left:22px;top:48px;width:44px;height:34px;border-radius:6px;background:linear-gradient(135deg,#e6c86e,#a8863a)}
#card .num{position:absolute;left:22px;bottom:50px;letter-spacing:3px;font-size:17px;opacity:.85}
#card .name{position:absolute;left:22px;bottom:22px;font-size:12px;opacity:.7;letter-spacing:2px}
#card .logo{position:absolute;right:22px;top:20px;font-weight:700;letter-spacing:2px;opacity:.9}

/* ===== DESIGNS DES SKINS ===== */
#card.steel{border-radius:4px;background:repeating-linear-gradient(115deg,#ffffff10 0 2px,transparent 2px 8px),linear-gradient(135deg,var(--card1),var(--card2))}
#card.steel::after{content:"";position:absolute;left:0;right:0;top:70px;height:22px;background:linear-gradient(90deg,#ffffff00,#ffffff55,#ffffff00);transform:skewY(-6deg);pointer-events:none}
#card.gold{border-radius:12px;border:3px solid #f7e08a;background:radial-gradient(circle at 20% 20%,#ffffff22 0 1px,transparent 2px) 0 0/22px 22px,linear-gradient(135deg,var(--card1),var(--card2))}
#card.gold .chip{box-shadow:inset 0 0 0 2px #fff6c0,0 2px 6px #0008}
#card.platinum{border-radius:20px;background:repeating-conic-gradient(#ffffff0c 0 25%,transparent 0 50%) 0 0/16px 16px,linear-gradient(135deg,var(--card1),var(--card2))}
#card.platinum::after{content:"";position:absolute;inset:0;border-radius:20px;background:linear-gradient(115deg,transparent 40%,#ffffff44 50%,transparent 60%);background-size:250% 100%;animation:sheen 3s infinite;pointer-events:none}
@keyframes sheen{from{background-position:150% 0}to{background-position:-50% 0}}
#card.black{border-radius:14px;border:2px solid #d4af37}
#card.black .name,#card.black .logo{color:#d4af37;text-shadow:0 1px 0 #000,0 0 6px #d4af3766}
#card.diamond{border-radius:18px;background:linear-gradient(135deg,#ffffff33 0%,transparent 35%),linear-gradient(225deg,#ffffff22 0%,transparent 40%),linear-gradient(135deg,var(--card1),var(--card2))}
#card.diamond::after{content:"✦";position:absolute;right:18px;top:14px;color:#fff;font-size:18px;animation:twinkle 2s infinite;pointer-events:none}
@keyframes twinkle{50%{opacity:.2}}
#card.empire{border-radius:22px;border:2px solid #ffd6f5;animation:halo 2.5s ease-in-out infinite}
#card.empire::before{content:"♛";position:absolute;right:16px;top:10px;font-size:26px;color:#ffd6f5;pointer-events:none}
@keyframes halo{50%{box-shadow:0 0 45px #ff6ad5ff,0 10px 30px #0008}}
/* ============================ */

.float{position:fixed;pointer-events:none;font-weight:700;color:#7dff9a;font-size:20px;animation:up .9s forwards;z-index:99}
.float.lucky{color:#ffd24a;font-size:26px}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.item{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .t{font-weight:600}
.item .d{font-size:12px;opacity:.65;margin-top:2px}
.item button{background:var(--accent);color:#111;border:none;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.item button:disabled{opacity:.35}
.ach.done{border-color:#7dff9a88}
.ach.done .t{color:#7dff9a}
.ach.ready{border-color:#ffd24a;box-shadow:0 0 12px #ffd24a44}
.ach.ready .t{color:#ffd24a}
.claimAll{width:100%;margin-bottom:12px;background:#ffd24a;color:#111;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:15px;cursor:pointer}
select,.btnr{background:#ffffff14;color:var(--text);border:1px solid #ffffff2a;border-radius:8px;padding:8px}
select option{background:#2a2a33;color:#f1f1f1}
.btnr{background:#a33;border:none;padding:10px 14px;font-weight:700;color:#fff;cursor:pointer}
input[type=range]{width:140px;accent-color:var(--accent)}
h3{margin:6px 0 12px}
</style>
</head>
<body>
<header>
<div id="money">$0</div>
<div id="info"></div>
<div id="gems" style="font-size:13px;margin-top:4px">💎 0</div>
</header>
<nav>
<button class="active" data-p="game" id="nGame">Card</button>
<button data-p="ach" id="nAch"><span id="nAchT">Achievements</span><span class="badge" id="badge">0</span></button>
<button data-p="set" id="nSet">Settings</button>
</nav>

<div class="page active" id="game">
<div id="cardWrap"><div id="card"><div class="logo" id="cLogo">EMPIRE</div><div class="chip"></div><div class="num">•••• •••• •••• 2026</div><div class="name" id="cName">STANDARD</div></div></div>
<h3 id="hUp">Upgrades</h3>
<div id="ups"></div>
</div>

<div class="page" id="ach">
<h3 id="hAch">Achievements</h3>
<button class="claimAll" id="claimAll" style="display:none"></button>
<div id="achList"></div>
</div>

<div class="page" id="set">
<h3 id="hSet">Settings</h3>
<div class="item"><span id="lLang">Language</span>
<select id="langSel"><option value="en">English</option><option value="fr">Français</option></select></div>
<div class="item"><span id="lSnd">Sound</span>
<select id="sndSel"><option value="1">On</option><option value="0">Off</option></select></div>
<div class="item"><span id="lMus">Music</span>
<select id="musSel"><option value="1">On</option><option value="0">Off</option></select></div>
<div class="item"><span id="lVol">Music volume</span>
<input type="range" id="volRange" min="0" max="100" step="1"></div>
<div class="item"><span id="lSkin">Card skin</span>
<select id="skinSel"></select></div>
<div class="item"><span id="lRes">Reset game</span><button class="btnr" id="resetBtn" type="button">Reset</button></div>
</div>

<script>
// ============ STATE ============
const DEF={money:0,total:0,clicks:0,gems:0,lang:"en",snd:1,mus:1,vol:30,ups:{click:0,mult:0,auto:0,tap:0,lucky:0,net:0},ach:{},claimed:{},skinChoice:0};
let S=JSON.parse(localStorage.getItem("empireTycoon")||"null")||JSON.parse(JSON.stringify(DEF));
for(const k in DEF){if(S[k]===undefined)S[k]=JSON.parse(JSON.stringify(DEF[k]))}
for(const k in DEF.ups){if(S.ups[k]===undefined)S.ups[k]=0}
if(!localStorage.getItem("empireTycoonV3")){
  for(const id in S.ach){S.claimed[id]=1}
  S.skinChoice=0;
  localStorage.setItem("empireTycoonV3","1");
}
function save(){localStorage.setItem("empireTycoon",JSON.stringify(S))}

// ============ TEXTES ============
const TX={
en:{card:"Card",ach:"Achievements",set:"Settings",up:"Upgrades",lang:"Language",snd:"Sound",mus:"Music",vol:"Music volume",skin:"Card skin",res:"Reset game",
confirm:"WARNING: This will permanently erase ALL your progress (money, upgrades, achievements, skins, gems and settings).\n\nClick OK to reset EVERYTHING. This cannot be undone.\n\nClick Cancel to keep your progress.",
perclick:"per click",persec:"per sec",claim:"Claim",claimall:"Claim all",on:"On",off:"Off",max:"MAX",lvl:"Lvl",
u_click:"Better Chip",u_clickd:"+$1 per click",u_mult:"Gold Swipe",u_multd:"x1.25 click gain",u_auto:"Auto Payments",u_autod:"+$1 per second",
u_tap:"Contactless",u_tapd:"+$5 per click",u_lucky:"Lucky Tap",u_luckyd:"+2% chance of a x5 click",u_net:"Premium Network",u_netd:"+$10 per second"},
fr:{card:"Carte",ach:"Succès",set:"Paramètres",up:"Améliorations",lang:"Langue",snd:"Son",mus:"Musique",vol:"Volume musique",skin:"Skin de carte",res:"Réinitialiser",
confirm:"ATTENTION : Cela va effacer DÉFINITIVEMENT toute ta progression (argent, améliorations, succès, skins, gemmes et paramètres).\n\nClique sur OK pour TOUT réinitialiser. Cette action est irréversible.\n\nClique sur Annuler pour garder ta progression.",
perclick:"par clic",persec:"par sec",claim:"Réclamer",claimall:"Tout réclamer",on:"Activé",off:"Désactivé",max:"MAX",lvl:"Niv",
u_click:"Meilleure puce",u_clickd:"+1$ par clic",u_mult:"Glissade dorée",u_multd:"x1,25 gain par clic",u_auto:"Paiements auto",u_autod:"+1$ par seconde",
u_tap:"Sans contact",u_tapd:"+5$ par clic",u_lucky:"Clic chanceux",u_luckyd:"+2% de chance d'un clic x5",u_net:"Réseau premium",u_netd:"+10$ par seconde"}
};
function t(k){return (TX[S.lang]&&TX[S.lang][k])||TX.en[k]||k}

// ============ SKINS ============
const SKINS=[
{n:"STANDARD",at:0,c1:"#3a3a42",c2:"#6b6b75",a:"#9aa0a6",b1:"#1a1a1f",b2:"#2a2a33",style:""},
{n:"STEEL",at:25000,c1:"#4a5560",c2:"#9fb0c0",a:"#b8c7d6",b1:"#1a2028",b2:"#28323c",style:"steel"},
{n:"GOLD",at:100000,c1:"#8a6a1a",c2:"#f0cf6a",a:"#f0cf6a",b1:"#22190a",b2:"#3a2c10",style:"gold"},
{n:"PLATINUM",at:10000000,c1:"#7c8aa0",c2:"#e8eef8",a:"#e8eef8",b1:"#151a24",b2:"#262f40",style:"platinum"},
{n:"BLACK",at:1000000000,c1:"#050505",c2:"#2b2b2b",a:"#d4af37",b1:"#000",b2:"#111",style:"black"},
{n:"DIAMOND",at:100000000000,c1:"#3aa0c8",c2:"#d8f6ff",a:"#7fe4ff",b1:"#06202c",b2:"#0e3a4c",style:"diamond"},
{n:"EMPIRE",at:10000000000000,c1:"#5a1a7a",c2:"#ff6ad5",a:"#ff9be8",b1:"#1a0626",b2:"#33104a",style:"empire"}
];
// STANDARD (index 0) est toujours disponible ; les autres doivent être réclamés
function skinClaimed(i){return i===0||!!S.claimed["skin"+i]}
function applySkin(){
  let idx=S.skinChoice;
  if(!skinClaimed(idx))idx=0;
  const s=SKINS[idx],r=document.documentElement.style;
  r.setProperty("--card1",s.c1);r.setProperty("--card2",s.c2);r.setProperty("--accent",s.a);
  r.setProperty("--bg1",s.b1);r.setProperty("--bg2",s.b2);
  const card=document.getElementById("card");
  card.className="";
  if(s.style)card.classList.add(s.style);
  document.getElementById("cName").textContent=s.n;
}
function renderSkinSel(){
  const sel=document.getElementById("skinSel");
  const opts=SKINS.map((s,i)=>i).filter(i=>skinClaimed(i));
  sel.innerHTML=opts.map(i=>'<option value="'+i+'">'+SKINS[i].n+'</option>').join("");
  sel.value=opts.includes(S.skinChoice)?S.skinChoice:0;
}

// ============ UPGRADES ============
const UPS={
click:{base:15,g:1.35,key:"u_click"},
auto:{base:60,g:1.4,key:"u_auto"},
tap:{base:400,g:1.45,key:"u_tap"},
mult:{base:900,g:2.1,key:"u_mult"},
lucky:{base:2500,g:1.6,key:"u_lucky",max:25},
net:{base:3500,g:1.5,key:"u_net"}
};
function cost(k){return Math.floor(UPS[k].base*Math.pow(UPS[k].g,S.ups[k]))}
function isMax(k){return UPS[k].max&&S.ups[k]>=UPS[k].max}
function perClick(){return (1+S.ups.click+5*S.ups.tap)*Math.pow(1.25,S.ups.mult)}
function perSecond(){return S.ups.auto+10*S.ups.net}
function luckyChance(){return Math.min(0.5,S.ups.lucky*0.02)}

// ============ FORMAT ============
function fmt(n){
  if(n<1000)return "$"+(n%1===0?n:n.toFixed(1));
  const u=["K","M","B","T","Qa"];let i=-1;
  while(n>=1000&&i<u.length-1){n/=1000;i++}
  return "$"+n.toFixed(2)+u[i];
}

// ============ SON ============
let AC=null;
function getAC(){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended"&&!document.hidden)AC.resume();
  return AC;
}
function click(){
  if(!S.snd)return;
  try{
    const a=getAC();
    const o=a.createOscillator(),g=a.createGain();
    o.frequency.value=520+Math.random()*60;o.type="triangle";
    g.gain.setValueAtTime(.06,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.08);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.08);
  }catch(e){}
}
const CHORDS=[
  [261.63,329.63,392.00],
  [349.23,440.00,523.25],
  [293.66,369.99,440.00],
  [392.00,493.88,587.33]
];
const MELODY=[523.25,587.33,659.25,783.99,659.25,587.33,523.25,659.25,783.99,880.00,783.99,659.25];
let chordIdx=0,melIdx=0;
function musicVol(){return S.mus&&S.snd!==0?(S.vol/100)*0.12:0}
function playNote(freq,start,dur,type,peak){
  const a=AC;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(peak,start+Math.min(0.4,dur*0.3));
  g.gain.linearRampToValueAtTime(0,start+dur);
  o.connect(g);g.connect(musicGain);
  o.start(start);o.stop(start+dur+0.05);
}
function playChord(){
  if(!S.mus||!AC||document.hidden||!musicGain)return;
  try{
    const now=AC.currentTime,ch=CHORDS[chordIdx%CHORDS.length];chordIdx++;
    ch.forEach(f=>playNote(f,now,3.8,"triangle",0.18));
    for(let i=0;i<2;i++){
      const f=MELODY[melIdx%MELODY.length];melIdx++;
      playNote(f,now+0.3+i*1.8,1.2,"sine",0.14);
    }
  }catch(e){}
}
let musicStarted=false,musicGain=null,musicTimer=null;
function startMusic(){
  if(musicStarted)return;
  try{
    const a=getAC();
    musicGain=a.createGain();
    musicGain.gain.value=musicVol();
    musicGain.connect(a.destination);
    musicStarted=true;
    playChord();
    musicTimer=setInterval(playChord,4000);
  }catch(e){}
}
function updateMusicVol(){
  if(musicGain&&AC)musicGain.gain.setTargetAtTime(musicVol(),AC.currentTime,0.1);
}
["pointerdown","touchstart","keydown"].forEach(ev=>
  document.addEventListener(ev,()=>{if(S.mus)startMusic();else getAC()},{passive:true}));

document.addEventListener("visibilitychange",()=>{
  if(!AC)return;
  if(document.hidden){
    if(musicGain){
      musicGain.gain.cancelScheduledValues(AC.currentTime);
      musicGain.gain.setValueAtTime(0,AC.currentTime);
    }
    AC.suspend();
  }else{
    if(AC.state==="suspended")AC.resume();
    if(musicGain){
      const target=musicVol();
      musicGain.gain.cancelScheduledValues(AC.currentTime);
      musicGain.gain.setValueAtTime(0,AC.currentTime);
      musicGain.gain.linearRampToValueAtTime(target,AC.currentTime+1.5);
    }
  }
});

// ============ ACHIEVEMENTS ============
const ACH=[];
[100,1000,10000,25000,100000,1000000,10000000,1000000000].forEach((v,i)=>
  ACH.push({id:"m"+v,en:"Hold "+fmt(v),fr:"Avoir "+fmt(v)+" en compte",gem:1+i,test:()=>S.money>=v}));
[10,100,500,1000,5000].forEach((v,i)=>
  ACH.push({id:"c"+v,en:"Click "+v+" times",fr:"Cliquer "+v+" fois",gem:1+i,test:()=>S.clicks>=v}));
ACH.push({id:"um5",en:"Gold Swipe",fr:"Glissade dorée",gem:3,test:()=>S.ups.mult>=1});
ACH.push({id:"ul10",en:"Lucky Tap",fr:"Clic chanceux",gem:3,test:()=>S.ups.lucky>=1});
ACH.push({id:"un5",en:"Premium Network",fr:"Réseau premium",gem:3,test:()=>S.ups.net>=1});
ACH.push({id:"ut5",en:"Contactless",fr:"Sans contact",gem:2,test:()=>S.ups.tap>=1});
ACH.push({id:"ua5",en:"Auto Payments",fr:"Paiements auto",gem:2,test:()=>S.ups.auto>=1});
ACH.push({id:"uc5",en:"Better Chip",fr:"Meilleure puce",gem:2,test:()=>S.ups.click>=1});
SKINS.forEach((s,i)=>{
  if(i===0)return;
  ACH.push({id:"skin"+i,en:"Card skin: "+s.n+" ("+fmt(s.at)+" in account)",fr:"Skin de carte : "+s.n+" ("+fmt(s.at)+" en compte)",gem:2+i,test:()=>S.money>=s.at});
});

function readyCount(){return ACH.filter(a=>S.ach[a.id]&&!S.claimed[a.id]).length}
function checkAch(){
  let ch=false;
  ACH.forEach(a=>{if(!S.ach[a.id]&&a.test()){S.ach[a.id]=1;ch=true}});
  if(ch){renderAch()}
  updateBadge();
}
function updateBadge(){
  const n=readyCount(),b=document.getElementById("badge");
  b.style.display=n>0?"block":"none";b.textContent=n;
}
function claim(id){
  const a=ACH.find(x=>x.id===id);
  if(a&&S.ach[id]&&!S.claimed[id]){
    S.claimed[id]=1;
    S.gems+=a.gem;
    // Si c'est un skin, on l'équipe directement
    if(id.startsWith("skin")){
      S.skinChoice=parseInt(id.slice(4),10);
    }
    click();
    save();
  }
}
function renderAch(){
  const n=readyCount(),ca=document.getElementById("claimAll");
  ca.style.display=n>0?"block":"none";
  ca.textContent=t("claimall")+" ("+n+")";
  const order=a=>S.ach[a.id]&&!S.claimed[a.id]?0:(!S.ach[a.id]?1:2);
  const list=ACH.map((a,i)=>({a,i})).sort((x,y)=>order(x.a)-order(y.a)||x.i-y.i).map(o=>o.a);
  document.getElementById("achList").innerHTML=list.map(a=>{
    const name=S.lang==="fr"?a.fr:a.en;
    const ready=S.ach[a.id]&&!S.claimed[a.id],done=S.claimed[a.id];
    return '<div class="item ach '+(done?"done":"")+(ready?" ready":"")+'"><div><div class="t">'+name+'</div></div><div>'+
      (ready?'<button data-c="'+a.id+'">'+t("claim")+' +'+a.gem+' 💎</button>':(done?"✔ ":"")+'+'+a.gem+' 💎')+'</div></div>';
  }).join("");
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    claim(b.dataset.c);renderAch();renderSkinSel();applySkin();update();
  });
  updateBadge();
}

// ============ UI ============
function addMoney(n){S.money+=n;S.total+=n}
function renderUps(){
  document.getElementById("ups").innerHTML=Object.keys(UPS).map(k=>{
    const mx=isMax(k);
    return '<div class="item"><div><div class="t">'+t(UPS[k].key)+' <small>('+t("lvl")+' '+S.ups[k]+')</small></div><div class="d">'+t(UPS[k].key+"d")+'</div></div><button data-u="'+k+'" '+(mx||S.money<cost(k)?"disabled":"")+'>'+(mx?t("max"):fmt(cost(k)))+'</button></div>';
  }).join("");
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.u,c=cost(k);
    if(!isMax(k)&&S.money>=c){S.money-=c;S.ups[k]++;click();update();checkAch();save()}
  });
}
function update(){
  document.getElementById("money").textContent=fmt(S.money);
  document.getElementById("info").textContent=fmt(perClick())+" "+t("perclick")+" • "+fmt(perSecond())+" "+t("persec");
  document.getElementById("gems").textContent="💎 "+S.gems;
  applySkin();renderUps();
}
function applyLang(){
  document.getElementById("nGame").textContent=t("card");
  document.getElementById("nAchT").textContent=t("ach");
  document.getElementById("nSet").textContent=t("set");
  document.getElementById("hUp").textContent=t("up");
  document.getElementById("hAch").textContent=t("ach");
  document.getElementById("hSet").textContent=t("set");
  document.getElementById("lLang").textContent=t("lang");
  document.getElementById("lSnd").textContent=t("snd");
  document.getElementById("lMus").textContent=t("mus");
  document.getElementById("lVol").textContent=t("vol");
  document.getElementById("lSkin").textContent=t("skin");
  document.getElementById("lRes").textContent=t("res");
  document.getElementById("resetBtn").textContent=t("res");
  const so=document.getElementById("sndSel").options,mo=document.getElementById("musSel").options;
  so[0].text=mo[0].text=t("on");so[1].text=mo[1].text=t("off");
  document.getElementById("langSel").value=S.lang;
  document.getElementById("sndSel").value=S.snd;
  document.getElementById("musSel").value=S.mus;
  document.getElementById("volRange").value=S.vol;
  renderSkinSel();
  renderAch();update();
}

function updateStickyHeader(page){
  document.body.classList.toggle("on-card",page==="game");
}

// ============ RESET ============
function resetGame(){
  if(!window.confirm(t("confirm")))return;
  try{
    localStorage.removeItem("empireTycoon");
    localStorage.removeItem("empireTycoonV3");
  }catch(e){}
  setTimeout(()=>location.reload(),50);
}

// ============ EVENTS ============
document.getElementById("card").addEventListener("pointerdown",e=>{
  let g=perClick(),lucky=false;
  if(Math.random()<luckyChance()){g*=5;lucky=true}
  addMoney(g);S.clicks++;click();
  const f=document.createElement("div");
  f.className="float"+(lucky?" lucky":"");
  f.textContent="+"+fmt(g)+(lucky?" ★":"");
  f.style.left=(e.clientX-20)+"px";
  f.style.top=(e.clientY-30)+"px";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),900);
  update();checkAch();
});

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.getElementById(b.dataset.p).classList.add("active");
  updateStickyHeader(b.dataset.p);
});

document.getElementById("claimAll").onclick=()=>{
  ACH.forEach(a=>claim(a.id));
  renderAch();renderSkinSel();applySkin();update();
};

document.getElementById("langSel").onchange=e=>{S.lang=e.target.value;applyLang();save()};
document.getElementById("sndSel").onchange=e=>{S.snd=+e.target.value;updateMusicVol();save()};
document.getElementById("musSel").onchange=e=>{
  S.mus=+e.target.value;
  if(S.mus)startMusic();
  updateMusicVol();save();
};
document.getElementById("volRange").oninput=e=>{S.vol=+e.target.value;updateMusicVol();save()};
document.getElementById("skinSel").onchange=e=>{
  S.skinChoice=+e.target.value;applySkin();save();
};
document.getElementById("resetBtn").addEventListener("click",resetGame);

// ============ LOOP ============
setInterval(()=>{
  const ps=perSecond();
  if(ps>0){addMoney(ps);update()}
  checkAch();
},1000);
setInterval(save,10000);
window.addEventListener("beforeunload",save);

// ============ INIT ============
applyLang();
checkAch();
updateStickyHeader("game");
</script>
</body>
</html>
