<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Empire Tycoon</title>
<style>
:root{--bg1:#1a1a1f;--bg2:#2a2a33;--accent:#9aa0a6;--text:#f1f1f1;--card1:#3a3a42;--card2:#6b6b75}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}
header{padding:14px;text-align:center;border-bottom:1px solid #ffffff22;background:var(--bg1);z-index:50}
body.on-card header{position:sticky;top:0}
#money{font-size:32px;font-weight:700;color:var(--accent)}
#info{font-size:13px;opacity:.7;margin-top:4px}
nav{display:flex;border-bottom:1px solid #ffffff22}
nav button{flex:1;padding:12px;background:none;border:none;color:var(--text);font-size:14px;opacity:.6;cursor:pointer;position:relative}
nav button.active{opacity:1;border-bottom:2px solid var(--accent)}
.badge{display:none;position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:#e33;color:#fff;font-size:11px;font-weight:700;line-height:18px;padding:0 5px}
.page{display:none;padding:14px;animation:fade .3s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#cardWrap{display:flex;justify-content:center;margin:24px 0}
#card{width:290px;height:180px;border-radius:16px;position:relative;cursor:pointer;background:linear-gradient(135deg,var(--card1),var(--card2));box-shadow:0 10px 30px #0008,inset 0 0 0 1px #ffffff22;transition:transform .08s}
#card:active{transform:scale(.95)}
#card .chip{position:absolute;left:22px;top:48px;width:44px;height:34px;border-radius:6px;background:linear-gradient(135deg,#e6c86e,#a8863a)}
#card .num{position:absolute;left:22px;bottom:50px;letter-spacing:3px;font-size:17px;opacity:.85}
#card .name{position:absolute;left:22px;bottom:22px;font-size:12px;opacity:.7;letter-spacing:2px}
#card .logo{position:absolute;right:22px;top:20px;font-weight:700;letter-spacing:2px;opacity:.9}
.float{position:fixed;pointer-events:none;font-weight:700;color:#7dff9a;font-size:20px;animation:up .9s forwards;z-index:99}
.float.lucky{color:#ffd54a;font-size:26px}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.upg{display:flex;justify-content:space-between;align-items:center;padding:12px;margin:8px 0;border-radius:12px;background:#ffffff0d}
.upg button,.btn{padding:8px 12px;border-radius:8px;border:none;background:var(--accent);color:#111;font-weight:700;cursor:pointer}
.upg button:disabled{opacity:.35}
.ach{padding:12px;margin:8px 0;border-radius:12px;background:#ffffff0d;display:flex;justify-content:space-between;align-items:center}
.ach.done{border-left:3px solid #7dff9a}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff15}
select,input[type=range]{background:#222;color:#fff;border:1px solid #444;border-radius:6px;padding:4px}
#resetBtn{background:#a33;color:#fff}
</style>
</head>
<body>

<header>
  <div id="money">$0</div>
  <div id="info"></div>
</header>

<nav>
  <button class="active" data-p="game"><span id="lCard">Card</span></button>
  <button data-p="ach"><span id="lAch">Achievements</span><span class="badge" id="achBadge"></span></button>
  <button data-p="set"><span id="lSet">Settings</span></button>
</nav>

<div id="game" class="page active">
  <div id="cardWrap"><div id="card">
    <div class="logo">EMPIRE</div>
    <div class="chip"></div>
    <div class="num">4000 •••• •••• 1234</div>
    <div class="name">TYCOON</div>
  </div></div>
  <div id="upgrades"></div>
</div>

<div id="ach" class="page">
  <button class="btn" id="claimAll">Claim all</button>
  <div id="achList"></div>
</div>

<div id="set" class="page">
  <div class="set"><span id="lLang">Language</span>
    <select id="langSel"><option value="en">English</option><option value="fr">Français</option></select></div>
  <div class="set"><span id="lSnd">Click sound</span>
    <select id="sndSel"><option value="1">On</option><option value="0">Off</option></select></div>
  <div class="set"><span id="lMus">Music</span>
    <select id="musSel"><option value="1">On</option><option value="0">Off</option></select></div>
  <div class="set"><span id="lVol">Music volume</span>
    <input type="range" id="volRange" min="0" max="100"></div>
  <div class="set"><span id="lRes">Reset</span>
    <button class="btn" id="resetBtn">Reset</button></div>
</div>

<script>
// ============ DATA ============
const DEF={money:0,total:0,clicks:0,lang:"en",snd:1,mus:1,vol:50,
  ups:{},ach:{},claimed:{},gems:0};
const S=JSON.parse(localStorage.getItem("empireTycoon")||"null")||JSON.parse(JSON.stringify(DEF));
for(const k in DEF){if(S[k]===undefined)S[k]=JSON.parse(JSON.stringify(DEF[k]))}
for(const k in DEF.ups){if(S.ups[k]===undefined)S.ups[k]=0}

function save(){localStorage.setItem("empireTycoon",JSON.stringify(S))}

// ============ LANG ============
const LANG={
  en:{card:"Card",ach:"Achievements",set:"Settings",up:"Upgrades",lang:"Language",snd:"Click sound",mus:"Music",vol:"Music volume",res:"Reset",confirm:"Erase all progress?",perclick:"per click",persec:"per sec",buy:"Buy",lvl:"Lvl",claim:"Claim",claimall:"Claim all",on:"On",off:"Off",max:"MAX"},
  fr:{card:"Carte",ach:"Succès",set:"Paramètres",up:"Améliorations",lang:"Langue",snd:"Son",mus:"Musique",vol:"Volume musique",res:"Réinitialiser",confirm:"Effacer toute la progression ?",perclick:"par clic",persec:"par sec",buy:"Acheter",lvl:"Niv",claim:"Réclamer",claimall:"Tout réclamer",on:"Activé",off:"Désactivé",max:"MAX"}
};
function t(k){return LANG[S.lang][k]||k}

function applyLang(){
  document.getElementById("lCard").textContent=t("card");
  document.getElementById("lAch").textContent=t("ach");
  document.getElementById("lSet").textContent=t("set");
  document.getElementById("lLang").textContent=t("lang");
  document.getElementById("lSnd").textContent=t("snd");
  document.getElementById("lMus").textContent=t("mus");
  document.getElementById("lVol").textContent=t("vol");
  document.getElementById("lRes").textContent=t("res");
  document.getElementById("claimAll").textContent=t("claimall");
  const so=document.getElementById("sndSel").options,mo=document.getElementById("musSel").options;
  so[0].text=mo[0].text=t("on");so[1].text=mo[1].text=t("off");
  document.getElementById("langSel").value=S.lang;
  document.getElementById("sndSel").value=S.snd;
  document.getElementById("musSel").value=S.mus;
  document.getElementById("volRange").value=S.vol;
  renderAch();update();
}

// ============ UPGRADES CARTE ============
const UPS=[
  {id:"u_tap",name:{en:"Contactless",fr:"Sans contact"},desc:{en:"+$5 per click",fr:"+5$ par clic"},base:50,cost:1.6,
    effect:l=>({click:5*l})},
  {id:"u_lucky",name:{en:"Lucky Tap",fr:"Tap chanceux"},desc:{en:"+2% chance of x5 click",fr:"+2% de chance de clic x5"},base:500,cost:1.8,
    effect:l=>({lucky:0.02*l})},
  {id:"u_net",name:{en:"Premium Network",fr:"Réseau premium"},desc:{en:"+$10 per second",fr:"+10$ par seconde"},base:2000,cost:2,
    effect:l=>({sec:10*l})}
];

function upCost(u){return Math.floor(u.base*Math.pow(u.cost,S.ups[u.id]))}
function perClick(){let v=1;UPS.forEach(u=>{if(u.effect(S.ups[u.id]).click)v+=u.effect(S.ups[u.id]).click});return v}
function perSecond(){let v=0;UPS.forEach(u=>{const e=u.effect(S.ups[u.id]);if(e.sec)v+=e.sec});return v}
function luckyChance(){let v=0;UPS.forEach(u=>{const e=u.effect(S.ups[u.id]);if(e.lucky)v+=e.lucky});return v}

function buyUp(id){
  const u=UPS.find(x=>x.id===id);
  const c=upCost(u);
  if(S.money>=c){S.money-=c;S.ups[id]++;update();save()}
}

// ============ ACHIEVEMENTS ============
const ACH=[
  {id:"a100",at:100,gems:1,name:{en:"First $100",fr:"Premier 100$"}},
  {id:"a1k",at:1000,gems:2,name:{en:"$1,000 saved",fr:"1 000$ économisés"}},
  {id:"a10k",at:10000,gems:4,name:{en:"$10,000 saved",fr:"10 000$ économisés"}},
  {id:"a100k",at:100000,gems:8,name:{en:"$100,000 saved",fr:"100 000$ économisés"}}
];
function checkAch(){
  ACH.forEach(a=>{if(S.total>=a.at)S.ach[a.id]=1});
  const n=Object.keys(S.ach).filter(k=>!S.claimed[k]).length;
  const b=document.getElementById("achBadge");
  b.style.display=n?"inline-block":"none";b.textContent=n;
}
function claim(id){
  if(S.ach[id]&&!S.claimed[id]){S.claimed[id]=1;S.gems+=ACH.find(a=>a.id===id).gems;save()}
}
function renderAch(){
  const list=document.getElementById("achList");list.innerHTML="";
  ACH.forEach(a=>{
    const done=S.ach[a.id],cl=S.claimed[a.id];
    const d=document.createElement("div");d.className="ach"+(done?" done":"");
    d.innerHTML=`<span>${a.name[S.lang]} (+${a.gems}💎)</span>`;
    const b=document.createElement("button");b.className="btn";
    b.textContent=cl?"✓":t("claim");b.disabled=!done||cl;
    b.onclick=()=>{claim(a.id);renderAch();update();checkAch()};
    d.appendChild(b);list.appendChild(d);
  });
  checkAch();
}

// ============ UI ============
function fmt(n){return "$"+Math.floor(n).toLocaleString("en-US")}
function update(){
  document.getElementById("money").textContent=fmt(S.money);
  document.getElementById("info").textContent=`${fmt(perClick())} ${t("perclick")} · ${fmt(perSecond())} ${t("persec")} · 💎 ${S.gems}`;
  renderUps();
}
function renderUps(){
  const box=document.getElementById("upgrades");box.innerHTML="";
  UPS.forEach(u=>{
    const c=upCost(u),d=document.createElement("div");d.className="upg";
    d.innerHTML=`<div><b>${u.name[S.lang]}</b> (${t("lvl")} ${S.ups[u.id]})<br><small>${u.desc[S.lang]}</small></div>`;
    const b=document.createElement("button");b.textContent=`${t("buy")} ${fmt(c)}`;
    b.disabled=S.money<c;b.onclick=()=>buyUp(u.id);
    d.appendChild(b);box.appendChild(d);
  });
}

// ============ AUDIO ============
let AC=null,musicGain=null,musicTimer=null,musicStarted=false,chordIdx=0,melIdx=0;
const CHORDS=[
  [261.63,329.63,392.00],[349.23,440.00,523.25],[293.66,369.99,440.00],[392.00,493.88,587.33]
];
const MELODY=[523.25,587.33,659.25,783.99,659.25,587.33,523.25,659.25,783.99,880.00,783.99,659.25];

function getAC(){
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  return AC;
}
function musicVol(){return S.mus&&S.snd!==0?(S.vol/100)*0.12:0}

function click(){
  if(!S.snd)return;
  try{
    const a=getAC(),o=a.createOscillator(),g=a.createGain();
    o.type="sine";o.frequency.value=1200;
    g.gain.setValueAtTime(0.08,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.08);
    o.connect(g);g.connect(a.destination);
    o.start();o.stop(a.currentTime+0.09);
  }catch(e){}
}

function playNote(freq,start,dur,type,peak){
  const a=AC;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(peak,start+Math.min(0.4,dur*0.3));
  g.gain.linearRampToValueAtTime(0,start+dur);
  o.connect(g);g.connect(musicGain);
  o.start(start);o.stop(start+dur+0.05);
}

function playChord(){
  // Ne joue rien si la musique est coupée ou si l'onglet est caché
  if(!S.mus||!AC||document.hidden||!musicGain)return;
  try{
    const now=AC.currentTime,ch=CHORDS[chordIdx%CHORDS.length];chordIdx++;
    ch.forEach(f=>playNote(f,now,3.8,"triangle",0.18));
    for(let i=0;i<2;i++){
      const f=MELODY[melIdx%MELODY.length];melIdx++;
      playNote(f,now+0.3+i*1.8,1.2,"sine",0.14);
    }
  }catch(e){}
}

function startMusic(){
  if(musicStarted)return;
  try{
    const a=getAC();
    musicGain=a.createGain();
    musicGain.gain.value=musicVol();
    musicGain.connect(a.destination);
    musicStarted=true;
    playChord();
    musicTimer=setInterval(playChord,4000);
  }catch(e){}
}

function updateMusicVol(){
  if(musicGain&&AC)musicGain.gain.setTargetAtTime(musicVol(),AC.currentTime,0.1);
}

["pointerdown","touchstart","keydown"].forEach(ev=>
  document.addEventListener(ev,()=>{if(S.mus)startMusic();else getAC()},{passive:true}));

// Pause propre : coupe le volume sans pic, remonte en douceur au retour
document.addEventListener("visibilitychange",()=>{
  if(!AC||!musicGain)return;
  const now=AC.currentTime;
  if(document.hidden){
    musicGain.gain.cancelScheduledValues(now);
    musicGain.gain.setValueAtTime(0,now);
  }else{
    if(AC.state==="suspended")AC.resume();
    const target=musicVol();
    musicGain.gain.cancelScheduledValues(AC.currentTime);
    musicGain.gain.setValueAtTime(0,AC.currentTime);
    musicGain.gain.linearRampToValueAtTime(target,AC.currentTime+1.5);
  }
});

// ============ HEADER COLLANT (onglet Carte seulement) ============
function updateStickyHeader(page){
  document.body.classList.toggle("on-card",page==="game");
}

// ============ EVENTS ============
document.getElementById("card").addEventListener("pointerdown",e=>{
  let g=perClick(),lucky=false;
  if(Math.random()<luckyChance()){g*=5;lucky=true}
  addMoney(g);S.clicks++;click();
  const f=document.createElement("div");
  f.className="float"+(lucky?" lucky":"");
  f.textContent="+"+fmt(g)+(lucky?" ★":"");
  f.style.left=(e.clientX-20)+"px";f.style.top=(e.clientY-30)+"px";
  document.body.appendChild(f);setTimeout(()=>f.remove(),900);
  update();checkAch();
});

function addMoney(v){S.money+=v;S.total+=v}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.getElementById(b.dataset.p).classList.add("active");
  updateStickyHeader(b.dataset.p);
});

document.getElementById("claimAll").onclick=()=>{
  ACH.forEach(a=>claim(a.id));renderAch();update();
};
document.getElementById("langSel").onchange=e=>{S.lang=e.target.value;applyLang();save()};
document.getElementById("sndSel").onchange=e=>{S.snd=+e.target.value;updateMusicVol();save()};
document.getElementById("musSel").onchange=e=>{
  S.mus=+e.target.value;
  if(S.mus)startMusic();
  updateMusicVol();save();
};
document.getElementById("volRange").oninput=e=>{S.vol=+e.target.value;updateMusicVol();save()};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm(t("confirm"))){localStorage.removeItem("empireTycoon");location.reload()}
};

// ============ LOOP ============
setInterval(()=>{const ps=perSecond();if(ps>0){addMoney(ps);update()}checkAch()},1000);
setInterval(save,10000);
window.addEventListener("beforeunload",save);

// ============ INIT ============
applyLang();checkAch();updateStickyHeader("game");
</script>
</body>
</html>
