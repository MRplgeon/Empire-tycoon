<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Empire Tycoon</title>
<style>
:root{--bg1:#1a1a1f;--bg2:#2a2a33;--accent:#9aa0a6;--text:#f1f1f1;--card1:#3a3a42;--card2:#6b6b75}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}
header{padding:14px;text-align:center;border-bottom:1px solid #ffffff22;background:inherit;z-index:50}
body.on-card header{position:sticky;top:0}
#money{font-size:32px;font-weight:700;color:var(--accent);transition:color 1s}
#info{font-size:13px;opacity:.7;margin-top:4px}
nav{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #ffffff22}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-width:25%;padding:12px;background:none;border:none;color:var(--text);font-size:14px;opacity:.6;cursor:pointer;position:relative}
nav button.active{opacity:1;border-bottom:2px solid var(--accent)}
.badge{display:none;position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:#e33;color:#fff;font-size:11px;line-height:18px;text-align:center}
.page{display:none;padding:14px;animation:fade .3s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#cardWrap{display:flex;justify-content:center;margin:24px 0}
#card{width:280px;height:170px;border-radius:16px;padding:16px;position:relative;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,var(--card1),var(--card2));box-shadow:0 12px 30px #0008;transition:transform .08s}
#card:active{transform:scale(.97)}
#card .pattern{position:absolute;inset:0;pointer-events:none}
#card .num{position:absolute;bottom:16px;left:16px;font-size:18px;letter-spacing:2px;opacity:.85}
.gain{position:absolute;font-weight:700;color:#7dff9a;pointer-events:none;animation:up .8s forwards;text-shadow:0 0 6px #000}
.sec{font-size:18px;font-weight:700;margin:6px 0 12px}
.item{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .t{font-weight:600}
.item .d{font-size:12px;opacity:.65;margin-top:2px}
.item button{background:var(--accent);color:#111;border:none;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.item button:disabled{opacity:.35}
.ach.done{border-color:#7dff9a88}
.ach.done .t{color:#7dff9a}
.ach.ready{border-color:var(--accent)}
.claimAll,#claimAll{width:100%;margin-bottom:12px;background:var(--accent);color:#111;border:none;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
select,input[type=range]{background:#ffffff14;color:var(--text);border:1px solid #ffffff2a;border-radius:8px;padding:8px}
label{display:block;margin:12px 0 4px;font-size:14px}
#resetBtn{background:#a33;color:#fff;border:none;border-radius:8px;padding:10px 14px;font-weight:700;margin-top:18px;cursor:pointer}
h3{margin:6px 0 12px}
body.on-card #card{box-shadow:0 0 0 2px var(--accent),0 12px 30px #0008}
</style>
</head>
<body>
<header>
  <div id="money">$0</div>
  <div id="info"></div>
  <div id="gems" style="font-size:13px;margin-top:6px">💎 0</div>
</header>
<nav>
  <button data-p="comp" id="nComp">Companies</button>
  <button data-p="game" class="active" id="nGame">Card</button>
  <button data-p="goods" id="nGoods">Assets</button>
  <button data-p="ach" id="nAch"><span id="hAch">Achievements</span><span class="badge" id="badge">0</span></button>
  <button data-p="profile" id="nProf">Profile</button>
  <button data-p="set" id="nSet">Settings</button>
</nav>

<div class="page active" id="game">
  <div id="cardWrap"><div id="card"><div class="pattern" id="pattern"></div><div class="num">•••• •••• •••• 0000</div></div></div>
  <div class="sec" id="hUp">Upgrades</div>
  <div id="upsList"></div>
</div>

<div class="page" id="comp">
  <div id="compList"></div>
</div>

<div class="page" id="goods">
  <div id="goodsRoot"></div>
</div>

<div class="page" id="ach">
  <button id="claimAll"></button>
  <div id="achList"></div>
</div>

<div class="page" id="profile">
  <div id="profList"></div>
</div>

<div class="page" id="set">
  <label id="lLang">Language</label>
  <select id="langSel"><option value="en">English</option><option value="fr">Français</option></select>
  <label id="lSnd">Sound effects</label>
  <select id="sndSel"><option value="1">On</option><option value="0">Off</option></select>
  <label id="lMus">Music</label>
  <select id="musSel"><option value="1">On</option><option value="0">Off</option></select>
  <label id="lVol">Music volume</label>
  <input type="range" id="volRange" min="0" max="100">
  <label id="lSkin">Card skin</label>
  <select id="skinSel"></select>
  <button id="resetBtn"></button>
</div>
<script>
// ============ STATE ============
const DEF={money:0,total:0,clicks:0,gems:0,lang:"en",snd:1,mus:1,vol:30,
  ups:{click:0,mult:0,tap:0,lucky:0},ach:{},claimed:{},skinChoice:0,
  companies:{},compLevels:{},
  re:{},reLv:{},
  veh:{},
  stats:{byCard:0,byComp:0,byRe:0,byVeh:0,bought:0,compBought:0,reBought:0,vehBought:0},
  reSort:"asc"
};
let S=JSON.parse(localStorage.getItem("empireTycoon")||"null")||JSON.parse(JSON.stringify(DEF));
for(const k in DEF){if(S[k]===undefined)S[k]=JSON.parse(JSON.stringify(DEF[k]))}
for(const k in DEF.ups){if(S.ups[k]===undefined)S.ups[k]=0}
for(const k in DEF.stats){if(S.stats[k]===undefined)S.stats[k]=0}
function save(){localStorage.setItem("empireTycoon",JSON.stringify(S))}

// ============ FORMAT ============
function fmt(n){
  if(n<1000)return "$"+(n%1===0?n:n.toFixed(1));
  const u=["K","M","B","T","Qa"];let i=-1;
  while(n>=1000&&i<u.length-1){n/=1000;i++}
  return "$"+n.toFixed(2)+u[i];
}

// ============ TEXTES ============
const TX={
en:{card:"Card",comp:"Companies",goods:"Assets",ach:"Achievements",prof:"Profile",set:"Settings",up:"Upgrades",lang:"Language",
  sound:"Sound effects",mus:"Music",vol:"Music volume",skin:"Card skin",res:"Reset progression",
  confirm:"WARNING: This will PERMANENTLY erase ALL your progress (money, upgrades, achievements, skins, gems, companies, assets, vehicles).\n\nClick OK to reset everything. This cannot be undone.\n\nClick Cancel to keep your progress.",
  perclick:"per click",persec:"per sec",claim:"Claim",claimall:"Claim all",on:"On",off:"Off",max:"MAX",lvl:"Lvl",buy:"Buy",merge:"Merge",
  realestate:"Real estate",vehicles:"Vehicles"},
fr:{card:"Carte",comp:"Entreprises",goods:"Biens",ach:"Succès",prof:"Profil",set:"Paramètres",up:"Améliorations",lang:"Langue",
  sound:"Effets sonores",mus:"Musique",vol:"Volume musique",skin:"Skin de carte",res:"Réinitialiser la progression",
  confirm:"ATTENTION : Cela va EFFACER DÉFINITIVEMENT toute ta progression (argent, améliorations, succès, skins, gemmes, entreprises, biens, véhicules).\n\nClique sur OK pour tout réinitialiser. Action irréversible.\n\nClique sur Annuler pour garder ta progression.",
  perclick:"par clic",persec:"par sec",claim:"Réclamer",claimall:"Tout réclamer",on:"Oui",off:"Non",max:"MAX",lvl:"Niv",buy:"Acheter",merge:"Fusionner",
  realestate:"Immobilier",vehicles:"Véhicules"}
};
function t(k){return TX[S.lang][k]||k}
// ============ UPGRADES ============
const UPS={
  click:{base:10,cost:50,max:50,k:"u_click",d:"u_clickd",g:1},
  mult:{base:0,cost:200,max:10,k:"u_mult",d:"u_multd",g:1.1},
  tap:{base:0,cost:300,max:30,k:"u_tap",d:"u_tapd",g:5},
  lucky:{base:0,cost:500,max:25,k:"u_lucky",d:"u_luckyd",g:0.02}
};
function upCost(key){
  const u=UPS[key];
  return Math.floor(u.cost*Math.pow(1.6,S.ups[key]));
}
function buyUp(key){
  const u=UPS[key];
  if(S.ups[key]>=u.max)return;
  const c=upCost(key);
  if(S.money<c)return;
  S.money-=c;
  S.ups[key]++;
  S.stats.bought++;
  save();
  renderAll();
}

// ============ COMPANIES ============
const COMPANIES=[
  {id:"lemon",en:"Lemonade Stand",fr:"Stand de limonade",price:100,inc:1,max:10},
  {id:"coffee",en:"Coffee Shop",fr:"Café",price:1000,inc:12,max:10},
  {id:"bakery",en:"Bakery",fr:"Boulangerie",price:10000,inc:120,max:10},
  {id:"gym",en:"Gym",fr:"Salle de sport",price:100000,inc:1300,max:10},
  {id:"hotel",en:"Hotel",fr:"Hôtel",price:1000000,inc:14000,max:10},
  {id:"factory",en:"Factory",fr:"Usine",price:12000000,inc:160000,max:10},
  {id:"bank",en:"Bank",fr:"Banque",price:150000000,inc:2000000,max:10},
  {id:"tech",en:"Tech Startup",fr:"Startup tech",price:2000000000,inc:28000000,max:10}
];
function compCount(id){return S.companies[id]||0}
function compIncome(c){return c.inc*compCount(c.id)}
function compPrice(c){
  const n=compCount(c.id);
  return Math.floor(c.price*Math.pow(1.5,n));
}
function buyComp(id){
  const c=COMPANIES.find(x=>x.id===id);
  if(!c)return;
  if(compCount(id)>=c.max)return;
  const p=compPrice(c);
  if(S.money<p)return;
  S.money-=p;
  S.companies[id]=compCount(id)+1;
  S.stats.compBought++;
  S.stats.bought++;
  save();
  renderAll();
}

// ============ REAL ESTATE ============
const RE=[
  {id:"flat",en:"Studio Flat",fr:"Studio",price:50000,inc:600,tier:1},
  {id:"house",en:"Family House",fr:"Maison familiale",price:500000,inc:7000,tier:2},
  {id:"villa",en:"Villa",fr:"Villa",price:3000000,inc:40000,tier:2},
  {id:"tower",en:"Tower",fr:"Tour",price:25000000,inc:350000,tier:3},
  {id:"estate",en:"Estate",fr:"Domaine",price:200000000,inc:3000000,tier:3}
];
function reOwned(id){return S.re[id]||0}
function reIncome(re){return re.inc*reOwned(re.id)}
function rePrice(re){
  const n=reOwned(re.id);
  return Math.floor(re.price*Math.pow(1.4,n));
}
function buyRe(id){
  const re=RE.find(x=>x.id===id);
  if(!re)return;
  const p=rePrice(re);
  if(S.money<p)return;
  S.money-=p;
  S.re[id]=reOwned(id)+1;
  S.stats.reBought++;
  S.stats.bought++;
  save();
  renderAll();
}

// ============ VEHICLES ============
const VEHICLES={
  cars:[
    {id:"car1",en:"Compact Car",fr:"Citadine",price:8000,inc:70},
    {id:"car2",en:"Sedan",fr:"Berline",price:60000,inc:800},
    {id:"car3",en:"Sports Car",fr:"Voiture de sport",price:500000,inc:7000}
  ],
  aircraft:[
    {id:"air1",en:"Light Plane",fr:"Avion léger",price:3000000,inc:45000},
    {id:"air2",en:"Jet",fr:"Jet privé",price:50000000,inc:700000}
  ],
  boats:[
    {id:"boat1",en:"Speedboat",fr:"Hors-bord",price:20000000,inc:260000},
    {id:"boat2",en:"Yacht",fr:"Yacht",price:300000000,inc:4500000}
  ]
};
function vehOwned(id){return S.veh[id]||0}
function vehPrice(v){
  const n=vehOwned(v.id);
  return Math.floor(v.price*Math.pow(1.5,n));
}
function vehIncome(v){return v.inc*vehOwned(v.id)}
function buyVeh(id){
  let v=null;
  for(const k in VEHICLES){const f=VEHICLES[k].find(x=>x.id===id);if(f){v=f;break}}
  if(!v)return;
  const p=vehPrice(v);
  if(S.money<p)return;
  S.money-=p;
  S.veh[id]=vehOwned(id)+1;
  S.stats.vehBought++;
  S.stats.bought++;
  save();
  renderAll();
}
// ============ INCOME ============
function incomePerSec(){
  let base=0;
  COMPANIES.forEach(c=>{base+=compIncome(c)});
  RE.forEach(re=>{base+=reIncome(re)});
  for(const k in VEHICLES){VEHICLES[k].forEach(v=>{base+=vehIncome(v)})}
  const mult=1+S.ups.mult*0.1;
  const auto=S.ups.lucky*0.02;
  return base*mult*(1+auto);
}
function clickValue(){
  return (1+S.ups.click)*(1+S.ups.mult*0.1);
}
function tapValue(){
  return S.ups.tap*2;
}

// ============ ACTIONS ============
function doClick(e){
  let gain=clickValue();
  if(Math.random()<S.ups.lucky*0.02){gain*=5;toast("Lucky!")}
  S.money+=gain;
  S.total+=gain;
  S.clicks++;
  S.stats.byCard+=gain;
  burst(e);
  save();
  updateTop();
}
function toast(msg){
  const el=document.createElement("div");
  el.className="toast";
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}
function burst(e){
  if(!e)return;
  const el=document.createElement("div");
  el.className="burst";
  el.textContent="+"+fmt(clickValue());
  el.style.left=(e.clientX||e.touches?.[0]?.clientX||0)+"px";
  el.style.top=(e.clientY||e.touches?.[0]?.clientY||0)+"px";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),700);
}

// ============ TICK ============
let last=Date.now();
function tick(){
  const now=Date.now();
  const dt=(now-last)/1000;
  last=now;
  const inc=incomePerSec()*dt;
  if(inc>0){
    S.money+=inc;
    S.total+=inc;
    S.stats.byComp+=inc;
  }
  updateTop();
}
setInterval(()=>{tick();save()},1000);
// ============ ACHIEVEMENTS ============
const SKINS=[
  {n:"Classic",at:0},
  {n:"Silver",at:10000},
  {n:"Gold",at:1000000},
  {n:"Platinum",at:100000000},
  {n:"Diamond",at:10000000000}
];
const ACH=[];
[100,1000,10000,25000,100000,1000000,10000000,1000000000].forEach((v,i)=>
  ACH.push({id:"m"+v,en:"Hold "+fmt(v),fr:"Avoir "+fmt(v)+" en compte",gem:1+i,test:()=>S.money>=v}));
[10,100,500,1000,5000].forEach((v,i)=>
  ACH.push({id:"c"+v,en:"Click "+v+" times",fr:"Cliquer "+v+" fois",gem:1+i,test:()=>S.clicks>=v}));
ACH.push({id:"um5",en:"Gold Swipe",fr:"Glissade dorée",gem:3,test:()=>S.ups.mult>=1});
ACH.push({id:"ul10",en:"Lucky Tap",fr:"Clic chanceux",gem:3,test:()=>S.ups.lucky>=1});
ACH.push({id:"un5",en:"Premium Network",fr:"Réseau premium",gem:3,test:()=>S.ups.net>=1});
ACH.push({id:"ut5",en:"Contactless",fr:"Sans contact",gem:2,test:()=>S.ups.tap>=1});
ACH.push({id:"ua5",en:"Auto Payments",fr:"Paiements auto",gem:2,test:()=>S.ups.auto>=1});
ACH.push({id:"uc5",en:"Better Chip",fr:"Meilleure puce",gem:2,test:()=>S.ups.click>=1});
COMPANIES.forEach((c,i)=>{
  ACH.push({id:"co"+c.id,en:"Own a "+c.en,fr:"Posséder : "+c.fr,gem:2+Math.min(i,4),test:()=>compCount(c.id)>=1});
});
RE.forEach((re,i)=>{
  ACH.push({id:"re"+re.id,en:"Own "+re.en,fr:"Posséder : "+re.fr,gem:2+Math.min(i,5),test:()=>reOwned(re.id)>=1});
});
SKINS.forEach((s,i)=>{
  if(i===0)return;
  ACH.push({id:"skin"+i,en:"Card skin: "+s.n+" ("+fmt(s.at)+" in account)",fr:"Skin de carte : "+s.n+" ("+fmt(s.at)+" en compte)",gem:2+i,test:()=>S.money>=s.at});
});
function checkAch(){
  ACH.forEach(a=>{
    if(!S.ach[a.id]&&a.test()){
      S.ach[a.id]=true;
      toast((S.lang==="fr"?"Succès débloqué : ":"Achievement unlocked: ")+(S.lang==="fr"?a.fr:a.en));
    }
  });
}
function claimAch(id){
  const a=ACH.find(x=>x.id===id);
  if(!a||!S.ach[id]||S.claimed[id])return;
  S.claimed[id]=true;
  S.gems+=a.gem;
  save();
  renderAll();
}
function claimAllAch(){
  ACH.forEach(a=>{if(S.ach[a.id]&&!S.claimed[a.id]){S.claimed[a.id]=true;S.gems+=a.gem}});
  save();
  renderAll();
}
setInterval(checkAch,1000);
// ============ SHOP / SKINS / GEMS ============
function buySkin(i){
  const s=SKINS[i];
  if(!s||S.skin===i)return;
  if(S.gems<s.gems||0)return;
  S.gems-=(s.gems||0);
  S.skin=i;
  save();
  renderAll();
}
function setSkin(i){
  if(i<0||i>=SKINS.length)return;
  if(S.money<SKINS[i].at&&i!==0)return;
  S.skin=i;
  save();
  renderAll();
}
function applySkin(){
  const s=SKINS[S.skin]||SKINS[0];
  document.documentElement.dataset.skin=s.n.toLowerCase();
  const card=document.getElementById("card");
  if(card)card.textContent=s.n;
}

// ============ AUTO PAYMENTS ============
let autoAcc=0;
function autoTick(){
  if(S.ups.auto<=0)return;
  autoAcc+=S.ups.auto*0.5;
  while(autoAcc>=1){
    autoAcc-=1;
    const g=clickValue();
    S.money+=g;
    S.total+=g;
    S.stats.byCard+=g;
  }
}
setInterval(autoTick,1000);

// ============ NET / DEBT ============
function netWorth(){
  let w=S.money;
  COMPANIES.forEach(c=>{w+=compCount(c.id)*c.price});
  RE.forEach(re=>{w+=reOwned(re.id)*re.price});
  for(const k in VEHICLES){VEHICLES[k].forEach(v=>{w+=vehOwned(v.id)*v.price})}
  return w;
}
function debtRatio(){
  const debt=Math.max(0,-S.money);
  const assets=netWorth();
  return assets>0?debt/assets:0;
}
// ============ RENDERING: TOP BAR ============
function updateTop(){
  const m=document.getElementById("money");
  if(m)m.textContent=fmt(S.money);
  const i=document.getElementById("income");
  if(i)i.textContent=fmt(incomePerSec())+"/s";
  const g=document.getElementById("gems");
  if(g)g.textContent=S.gems;
  const c=document.getElementById("clickVal");
  if(c)c.textContent="+"+fmt(clickValue());
  const d=document.getElementById("debt");
  if(d){
    const r=debtRatio();
    d.textContent=r>0?(r*100).toFixed(1)+"%":"0%";
    d.classList.toggle("danger",r>0.5);
  }
}

// ============ RENDERING: TABS ============
function showTab(name){
  S.tab=name;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===name));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="p-"+name));
  renderAll();
}

// ============ RENDERING: LISTS ============
function renderCompanies(){
  const el=document.getElementById("list-companies");
  if(!el)return;
  el.innerHTML="";
  COMPANIES.forEach(c=>{
    const n=compCount(c.id);
    const cost=compCost(c);
    const row=document.createElement("div");
    row.className="item";
    row.innerHTML=`<div><b>${nm(c)}</b><small>${fmt(compIncome(c))}/s · ${n} owned</small></div>`;
    const btn=document.createElement("button");
    btn.textContent=fmt(cost);
    btn.disabled=S.money<cost;
    btn.onclick=()=>buyComp(c.id);
    row.appendChild(btn);
    el.appendChild(row);
  });
}
function renderRE(){
  const el=document.getElementById("list-re");
  if(!el)return;
  el.innerHTML="";
  RE.forEach(re=>{
    const n=reOwned(re.id);
    const cost=reCost(re);
    const row=document.createElement("div");
    row.className="item";
    row.innerHTML=`<div><b>${nm(re)}</b><small>${fmt(reIncome(re))}/s · ${n} owned</small></div>`;
    const btn=document.createElement("button");
    btn.textContent=fmt(cost);
    btn.disabled=S.money<cost;
    btn.onclick=()=>buyRE(re.id);
    row.appendChild(btn);
    el.appendChild(row);
  });
}

// ============ RENDERING: ALL ============
function renderAll(){
  updateTop();
  applySkin();
  if(S.tab==="companies")renderCompanies();
  if(S.tab==="re")renderRE();
  if(S.tab==="ach")renderAch();
  if(S.tab==="skins")renderSkins();
  if(S.tab==="upgrades")renderUpgrades();
}
// ============ RENDERING: ACHIEVEMENTS ============
function renderAch(){
  const el=document.getElementById("list-ach");
  if(!el)return;
  el.innerHTML="";
  const claimable=ACH.filter(a=>S.ach[a.id]&&!S.claimed[a.id]).length;
  const head=document.createElement("div");
  head.className="item";
  head.innerHTML=`<div><b>${S.lang==="fr"?"Succès":"Achievements"}</b><small>${claimable} ${S.lang==="fr"?"à réclamer":"to claim"}</small></div>`;
  const all=document.createElement("button");
  all.textContent=S.lang==="fr"?"Tout réclamer":"Claim all";
  all.disabled=claimable===0;
  all.onclick=claimAllAch;
  head.appendChild(all);
  el.appendChild(head);
  ACH.forEach(a=>{
    const unlocked=!!S.ach[a.id];
    const claimed=!!S.claimed[a.id];
    const row=document.createElement("div");
    row.className="item"+(unlocked?"":" locked");
    row.innerHTML=`<div><b>${S.lang==="fr"?a.fr:a.en}</b><small>💎 ${a.gem}</small></div>`;
    const btn=document.createElement("button");
    if(claimed){btn.textContent=S.lang==="fr"?"Réclamé":"Claimed";btn.disabled=true}
    else if(unlocked){btn.textContent=S.lang==="fr"?"Réclamer":"Claim";btn.onclick=()=>claimAch(a.id)}
    else{btn.textContent="🔒";btn.disabled=true}
    row.appendChild(btn);
    el.appendChild(row);
  });
}

// ============ RENDERING: SKINS ============
function renderSkins(){
  const el=document.getElementById("list-skins");
  if(!el)return;
  el.innerHTML="";
  SKINS.forEach((s,i)=>{
    const unlocked=i===0||S.money>=s.at;
    const row=document.createElement("div");
    row.className="item"+(unlocked?"":" locked");
    row.innerHTML=`<div><b>${s.n}</b><small>${unlocked?"":fmt(s.at)+" "+(S.lang==="fr"?"requis":"required")}</small></div>`;
    const btn=document.createElement("button");
    if(S.skin===i){btn.textContent=S.lang==="fr"?"Actif":"Active";btn.disabled=true}
    else if(unlocked){btn.textContent=S.lang==="fr"?"Équiper":"Equip";btn.onclick=()=>setSkin(i)}
    else{btn.textContent="🔒";btn.disabled=true}
    row.appendChild(btn);
    el.appendChild(row);
  });
}
// ============ RENDERING: UPGRADES ============
function renderUpgrades(){
  const el=document.getElementById("list-upgrades");
  if(!el)return;
  el.innerHTML="";
  UPG.forEach(u=>{
    const lvl=S.ups[u.key]||0;
    const cost=upgCost(u);
    const maxed=u.max&&lvl>=u.max;
    const row=document.createElement("div");
    row.className="item";
    row.innerHTML=`<div><b>${S.lang==="fr"?u.fr:u.en}</b><small>${S.lang==="fr"?"Niveau":"Level"} ${lvl}${u.max?"/"+u.max:""}</small></div>`;
    const btn=document.createElement("button");
    if(maxed){btn.textContent="MAX";btn.disabled=true}
    else{
      btn.textContent=fmt(cost);
      btn.disabled=S.money<cost;
      btn.onclick=()=>buyUpg(u.key);
    }
    row.appendChild(btn);
    el.appendChild(row);
  });
}

// ============ CLAIM HELPERS ============
function claimAch(id){
  if(!S.ach[id]||S.claimed[id])return;
  const a=ACH.find(x=>x.id===id);
  if(!a)return;
  S.claimed[id]=true;
  S.gems+=a.gem;
  save();
  renderAll();
}
function claimAllAch(){
  ACH.forEach(a=>{
    if(S.ach[a.id]&&!S.claimed[a.id]){
      S.claimed[a.id]=true;
      S.gems+=a.gem;
    }
  });
  save();
  renderAll();
}

// ============ ACHIEVEMENT CHECK ============
function checkAch(){
  let changed=false;
  ACH.forEach(a=>{
    if(!S.ach[a.id]&&a.test()){
      S.ach[a.id]=true;
      changed=true;
      toast((S.lang==="fr"?"Succès débloqué : ":"Achievement unlocked: ")+(S.lang==="fr"?a.fr:a.en));
    }
  });
  if(changed)save();
}
setInterval(checkAch,2000);

// ============ TOAST ============
function toast(msg){
  const t=document.getElementById("toast");
  if(!t)return;
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h=setTimeout(()=>t.classList.remove("show"),2500);
}
// ============ GAME LOOP ============
let lastTick=Date.now();
function tick(){
  const now=Date.now();
  const dt=Math.min((now-lastTick)/1000,1);
  lastTick=now;
  const gain=incomePerSec()*dt;
  if(gain>0){
    S.money+=gain;
    S.total+=gain;
  }
  if(S.debt>0){
    S.debt=Math.max(0,S.debt-S.debt*0.0005*dt);
  }
  updateTop();
  if(S.tab==="companies")renderCompanies();
  if(S.tab==="re")renderRE();
  if(S.tab==="upgrades")renderUpgrades();
  if(S.tab==="skins")renderSkins();
  if(S.tab==="ach")renderAch();
}
setInterval(tick,100);

// ============ INIT ============
function init(){
  document.querySelectorAll(".tab").forEach(t=>{
    t.addEventListener("click",()=>showTab(t.dataset.tab));
  });
  const clickBtn=document.getElementById("clickBtn");
  if(clickBtn)clickBtn.addEventListener("click",doClick);
  const langBtn=document.getElementById("langBtn");
  if(langBtn)langBtn.addEventListener("click",()=>{
    S.lang=S.lang==="fr"?"en":"fr";
    save();
    renderAll();
  });
  applySkin();
  showTab(S.tab||"companies");
  renderAll();
}
window.addEventListener("beforeunload",save);
init();
  </script>
</body>
</html>
