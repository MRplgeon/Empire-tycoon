<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Empire Tycoon</title>
<style>
:root{--bg1:#1a1a1f;--bg2:#2a2a33;--accent:#9aa0a6;--text:#f1f1f1;--card1:#3a3a42;--card2:#6b6b75}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;transition:background 1.5s}
header{padding:14px;text-align:center;border-bottom:1px solid #ffffff22}
#money{font-size:32px;font-weight:700;color:var(--accent);transition:color 1s}
#info{font-size:13px;opacity:.7;margin-top:4px}
nav{display:flex;border-bottom:1px solid #ffffff22}
nav button{flex:1;padding:12px;background:none;border:none;color:var(--text);font-size:14px;opacity:.6;cursor:pointer}
nav button.active{opacity:1;border-bottom:2px solid var(--accent)}
.page{display:none;padding:14px;animation:fade .3s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#cardWrap{display:flex;justify-content:center;margin:24px 0}
#card{width:290px;height:180px;border-radius:16px;position:relative;cursor:pointer;background:linear-gradient(135deg,var(--card1),var(--card2));box-shadow:0 10px 30px #0008,inset 0 0 0 1px #ffffff22;transition:transform .08s}
#card:active{transform:scale(.95)}
#card .chip{position:absolute;left:22px;top:48px;width:44px;height:34px;border-radius:6px;background:linear-gradient(135deg,#e6c86e,#a8863a)}
#card .num{position:absolute;left:22px;bottom:50px;letter-spacing:3px;font-size:17px;opacity:.85}
#card .name{position:absolute;left:22px;bottom:22px;font-size:12px;opacity:.7;letter-spacing:2px}
#card .logo{position:absolute;right:22px;top:20px;font-weight:700;letter-spacing:2px;opacity:.9}
.float{position:fixed;pointer-events:none;font-weight:700;color:#7dff9a;font-size:20px;animation:up .9s forwards;z-index:99}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.item{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .t{font-weight:600}
.item .d{font-size:12px;opacity:.65;margin-top:2px}
.item button{background:var(--accent);color:#111;border:none;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.item button:disabled{opacity:.35}
.ach.done{border-color:#7dff9a88}
.ach.done .t{color:#7dff9a}
select,.btnr{background:#ffffff14;color:var(--text);border:1px solid #ffffff2a;border-radius:8px;padding:8px}
.btnr{background:#a33;border:none;padding:10px 14px;font-weight:700}
h3{margin:6px 0 12px}
</style>
</head>
<body>
<header>
<div id="money">$0</div>
<div id="info"></div>
<div id="gems" style="font-size:13px;margin-top:4px">💎 0</div>
</header>
<nav>
<button class="active" data-p="game" id="nGame">Card</button>
<button data-p="ach" id="nAch">Achievements</button>
<button data-p="set" id="nSet">Settings</button>
</nav>

<div class="page active" id="game">
<div id="cardWrap"><div id="card"><div class="logo" id="cLogo">EMPIRE</div><div class="chip"></div><div class="num">•••• •••• •••• 2026</div><div class="name" id="cName">STANDARD</div></div></div>
<h3 id="hUp">Upgrades</h3>
<div id="ups"></div>
</div>

<div class="page" id="ach">
<h3 id="hAch">Achievements</h3>
<div id="achList"></div>
</div>

<div class="page" id="set">
<h3 id="hSet">Settings</h3>
<div class="item"><span id="lLang">Language</span>
<select id="langSel"><option value="en">English</option><option value="fr">Français</option></select></div>
<div class="item"><span id="lSnd">Sound</span>
<select id="sndSel"><option value="1">On</option><option value="0">Off</option></select></div>
<div class="item"><span id="lRes">Reset game</span><button class="btnr" id="resetBtn">Reset</button></div>
</div>
<script>
// ============ STATE ============
const DEF={money:0,total:0,clicks:0,gems:0,lang:"en",snd:1,ups:{click:0,mult:0,auto:0},ach:{},skin:0};
let S=JSON.parse(localStorage.getItem("empireTycoon")||"null")||JSON.parse(JSON.stringify(DEF));
for(const k in DEF){if(S[k]===undefined)S[k]=DEF[k]}
function save(){localStorage.setItem("empireTycoon",JSON.stringify(S))}

// ============ TEXTES ============
const TX={
en:{card:"Card",ach:"Achievements",set:"Settings",up:"Upgrades",lang:"Language",snd:"Sound",res:"Reset game",confirm:"Erase all progress?",perclick:"per click",persec:"per sec",buy:"Buy",lvl:"Lvl",
u_click:"Better Chip",u_clickd:"+$1 per click",u_mult:"Gold Swipe",u_multd:"x1.25 click gain",u_auto:"Auto Payments",u_autod:"+$1 per second"},
fr:{card:"Carte",ach:"Succès",set:"Paramètres",up:"Améliorations",lang:"Langue",snd:"Son",res:"Réinitialiser",confirm:"Effacer toute la progression ?",perclick:"par clic",persec:"par sec",buy:"Acheter",lvl:"Niv",
u_click:"Meilleure puce",u_clickd:"+1$ par clic",u_mult:"Glissade dorée",u_multd:"x1,25 gain par clic",u_auto:"Paiements auto",u_autod:"+1$ par seconde"}
};
function t(k){return (TX[S.lang]&&TX[S.lang][k])||TX.en[k]||k}

// ============ SKINS ============
const SKINS=[
{n:"STANDARD",at:0,c1:"#3a3a42",c2:"#6b6b75",a:"#9aa0a6",b1:"#1a1a1f",b2:"#2a2a33"},
{n:"STEEL",at:25000,c1:"#4a5560",c2:"#9fb0c0",a:"#b8c7d6",b1:"#1a2028",b2:"#28323c"},
{n:"GOLD",at:100000,c1:"#8a6a1a",c2:"#f0cf6a",a:"#f0cf6a",b1:"#22190a",b2:"#3a2c10"},
{n:"PLATINUM",at:10000000,c1:"#7c8aa0",c2:"#e8eef8",a:"#e8eef8",b1:"#151a24",b2:"#262f40"},
{n:"BLACK",at:1000000000,c1:"#050505",c2:"#2b2b2b",a:"#d4af37",b1:"#000",b2:"#111"},
{n:"DIAMOND",at:100000000000,c1:"#3aa0c8",c2:"#d8f6ff",a:"#7fe4ff",b1:"#06202c",b2:"#0e3a4c"},
{n:"EMPIRE",at:10000000000000,c1:"#5a1a7a",c2:"#ff6ad5",a:"#ff9be8",b1:"#1a0626",b2:"#33104a"}
];
function applySkin(){
  let idx=0;SKINS.forEach((s,i)=>{if(S.total>=s.at)idx=i});
  S.skin=idx;const s=SKINS[idx],r=document.documentElement.style;
  r.setProperty("--card1",s.c1);r.setProperty("--card2",s.c2);r.setProperty("--accent",s.a);
  r.setProperty("--bg1",s.b1);r.setProperty("--bg2",s.b2);
  document.getElementById("cName").textContent=s.n;
}

// ============ UPGRADES ============
const UPS={
click:{base:15,g:1.35,key:"u_click"},
mult:{base:500,g:2.1,key:"u_mult"},
auto:{base:60,g:1.4,key:"u_auto"}
};
function cost(k){return Math.floor(UPS[k].base*Math.pow(UPS[k].g,S.ups[k]))}
function perClick(){return (1+S.ups.click)*Math.pow(1.25,S.ups.mult)*(1+S.gems*0)}
function perSecond(){return S.ups.auto}

// ============ FORMAT ============
function fmt(n){
  if(n<1000)return "$"+(n%1===0?n:n.toFixed(1));
  const u=["K","M","B","T","Qa"];let i=-1;
  while(n>=1000&&i<u.length-1){n/=1000;i++}
  return "$"+n.toFixed(2)+u[i];
}

// ============ SON ============
let AC=null;
function click(){
  if(!S.snd)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.frequency.value=520+Math.random()*60;o.type="triangle";
    g.gain.setValueAtTime(.06,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.08);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.08);
  }catch(e){}
}

// ============ ACHIEVEMENTS ============
const ACH=[];
[100,1000,10000,25000,100000,1000000,10000000,1000000000].forEach((v,i)=>
  ACH.push({id:"m"+v,en:"Earn "+fmt(v),fr:"Gagner "+fmt(v),gem:1+i,test:()=>S.total>=v}));
[10,100,500,1000,5000].forEach((v,i)=>
  ACH.push({id:"c"+v,en:"Click "+v+" times",fr:"Cliquer "+v+" fois",gem:1+i,test:()=>S.clicks>=v}));
[5,15,30].forEach(v=>
  ACH.push({id:"uc"+v,en:"Better Chip level "+v,fr:"Meilleure puce niv "+v,gem:2,test:()=>S.ups.click>=v}));
[5,15].forEach(v=>
  ACH.push({id:"ua"+v,en:"Auto Payments level "+v,fr:"Paiements auto niv "+v,gem:2,test:()=>S.ups.auto>=v}));
ACH.push({id:"um5",en:"Gold Swipe level 5",fr:"Glissade dorée niv 5",gem:3,test:()=>S.ups.mult>=5});
function checkAch(){
  let ch=false;
  ACH.forEach(a=>{if(!S.ach[a.id]&&a.test()){S.ach[a.id]=1;S.gems+=a.gem;ch=true}});
  if(ch){renderAch();update()}
}
function renderAch(){
  document.getElementById("achList").innerHTML=ACH.map(a=>
    '<div class="item ach '+(S.ach[a.id]?"done":"")+'"><div><div class="t">'+(S.lang==="fr"?a.fr:a.en)+'</div></div><div>'+(S.ach[a.id]?"✔ ":"")+'+'+a.gem+' 💎</div></div>').join("");
}

// ============ UI ============
function addMoney(n){S.money+=n;S.total+=n}
function renderUps(){
  document.getElementById("ups").innerHTML=Object.keys(UPS).map(k=>
    '<div class="item"><div><div class="t">'+t(UPS[k].key)+' <small>('+t("lvl")+' '+S.ups[k]+')</small></div><div class="d">'+t(UPS[k].key+"d")+'</div></div><button data-u="'+k+'" '+(S.money<cost(k)?"disabled":"")+'>'+fmt(cost(k))+'</button></div>').join("");
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.u,c=cost(k);
    if(S.money>=c){S.money-=c;S.ups[k]++;click();update();checkAch();save()}
  });
}
function update(){
  document.getElementById("money").textContent=fmt(S.money);
  document.getElementById("info").textContent=fmt(perClick())+" "+t("perclick")+" • "+fmt(perSecond())+" "+t("persec");
  document.getElementById("gems").textContent="💎 "+S.gems;
  applySkin();renderUps();
}
function applyLang(){
  document.getElementById("nGame").textContent=t("card");
  document.getElementById("nAch").textContent=t("ach");
  document.getElementById("nSet").textContent=t("set");
  document.getElementById("hUp").textContent=t("up");
  document.getElementById("hAch").textContent=t("ach");
  document.getElementById("hSet").textContent=t("set");
  document.getElementById("lLang").textContent=t("lang");
  document.getElementById("lSnd").textContent=t("snd");
  document.getElementById("lRes").textContent=t("res");
  document.getElementById("langSel").value=S.lang;
  document.getElementById("sndSel").value=S.snd;
  renderAch();update();
}

// ============ EVENTS ============
document.getElementById("card").addEventListener("pointerdown",e=>{
  const g=perClick();addMoney(g);S.clicks++;click();
  const f=document.createElement("div");f.className="float";f.textContent="+"+fmt(g);
  f.style.left=(e.clientX-20)+"px";f.style.top=(e.clientY-30)+"px";
  document.body.appendChild(f);setTimeout(()=>f.remove(),900);
  update();checkAch();
});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");document.getElementById(b.dataset.p).classList.add("active");
});
document.getElementById("langSel").onchange=e=>{S.lang=e.target.value;applyLang();save()};
document.getElementById("sndSel").onchange=e=>{S.snd=+e.target.value;save()};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm(t("confirm"))){localStorage.removeItem("empireTycoon");location.reload()}
};

// ============ LOOP ============
setInterval(()=>{const ps=perSecond();if(ps>0){addMoney(ps);update()}checkAch()},1000);
setInterval(save,10000);
window.addEventListener("beforeunload",save);

// ============ INIT ============
applyLang();checkAch();
</script>
</body>
</html>
